<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WheresMyTram</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #38bdf8;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --font-ui: 'Space Grotesk', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
  /* iOS Safari safe area support */
  html { height: -webkit-fill-available; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: -webkit-fill-available; }

  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; height: 52px; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    z-index: 1000;
  }
  #topbar .logo { display: flex; align-items: center; gap: 10px; }
  #topbar .logo-icon {
    width: 28px; height: 28px; background: var(--accent);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #0b0f1a; flex-shrink: 0;
  }
  #topbar .logo-icon img { width: 72%; height: 72%; object-fit: contain; display: block; }

  /* Stop + location dots: plain markers so leaflet-rotate positions them */
  .stop-dot {
    width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box;
    background: rgba(100, 116, 139, 0.9); border: 1.5px solid #fff;
  }
  /* Stop tabs: a 16px-tall stadium whose HOT end sits exactly where the old dot
     sat, with the tail extending 22px (one tram-dot diameter) to the side of the
     road the platform is on. A tram sitting on the stop can no longer hide it,
     and a staggered platform pair reads as two platforms instead of one blob.
     --r is the tab's own rotation, baked into one of 36 shared 10-degree buckets
     so all 1,638 markers share 36 icon objects. --mb is the live map bearing,
     set once on the map container, so rotating the map recomputes every tab from
     a single style write instead of a 1,638-marker loop. */
 .stop-tab { background: none; border: none; }
  /* audit mode (?audit=1): red = this stop sits further than AUDIT_LIMIT_M from
     the line of at least one route it claims, so that route probably isn't real */
  .stop-tab.rogue i { background: rgba(248,113,113,0.92); border-color: #fecaca; }
  .stop-tab i {
    display: block; width: 38px; height: 16px; box-sizing: border-box;
    border-radius: 8px;
    background: rgba(100, 116, 139, 0.9); border: 1.5px solid #fff;
    transform-origin: 100% 50%;
    transform: rotate(calc((var(--r, 0) - var(--mb, 0)) * 1deg));
  }
  .loc-dot {
    width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box;
    background: #38bdf8; border: 2.5px solid #fff;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  #topbar .subtitle { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  #status-group { display: flex; align-items: center; gap: 12px; }
  #live-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-family: var(--font-mono); color: var(--green);
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }

  #tram-count-badge {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 20px; color: var(--accent);
  }

  #clock { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  /* ── Main content ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px; flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  #sidebar-header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); font-family: var(--font-mono);
  }

  #route-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  #route-list::-webkit-scrollbar { width: 4px; }
  #route-list::-webkit-scrollbar-track { background: transparent; }
  #route-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .route-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; cursor: pointer; transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .route-item:hover { background: var(--surface2); }
  .route-item.active { background: var(--surface2); border-left-color: var(--color); }
  .route-item.dimmed { opacity: 1; }

  .route-num {
    width: 32px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; font-family: var(--font-mono);
    flex-shrink: 0; color: #fff;
  }
  .route-name { font-size: 12px; color: var(--text); flex: 1; line-height: 1.3; }

  /* Toggle switch */
  .route-toggle {
    flex-shrink: 0; width: 28px; height: 16px; border-radius: 8px;
    background: var(--muted); position: relative; transition: background 0.2s;
    cursor: pointer;
  }
  .route-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%; background: #fff;
    transition: transform 0.2s;
  }
  .route-item:not(.dimmed) .route-toggle { background: var(--color); }
  .route-item:not(.dimmed) .route-toggle::after { transform: translateX(12px); }
  .route-tram-count {
    font-size: 10px; font-family: var(--font-mono); color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 10px; min-width: 24px; text-align: center;
  }

  #sidebar-footer {
    padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted); font-family: var(--font-mono);
    line-height: 1.6;
  }

  /* ── Map ── */
  #map { flex: 1; }


  /* ── Bottom bar (mobile) ── */
  #bottombar {
    display: none;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 10px 8px; gap: 6px; flex-direction: column;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    z-index: 1000; flex-shrink: 0;
  }
  #mobile-controls {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  }
  #mobile-tram-count { margin-left: auto; }

  /* ── Info panel (floating) ── */
  #info-panel {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 18px;
    font-size: 13px; z-index: 2000; min-width: 280px; max-width: 380px;
    max-height: 55vh; overflow-y: auto;
    display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }
  #info-panel.visible { display: block; }
  #notice-overlay {
    position: fixed; inset: 0; z-index: 3000; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
  }
  #notice-overlay.visible { display: flex; }
  #notice-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 26px; font-size: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 80vw; text-align: center;
  }
  #info-close {
    position: absolute; top: 8px; right: 12px;
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; line-height: 1;
  }
  .info-row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .info-label { font-size: 10px; font-family: var(--font-mono); color: var(--muted); width: 70px; flex-shrink: 0; }
  .info-value { font-size: 13px; color: var(--text); }
  .info-route-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 22px; border-radius: 5px;
    font-weight: 700; font-size: 13px; font-family: var(--font-mono); color: #fff;
    margin-right: 6px;
  }

  /* ── Refresh button ── */
  #refresh-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--accent); padding: 5px 12px; border-radius: 6px;
    font-family: var(--font-mono); font-size: 11px; cursor: pointer;
    transition: background 0.15s; white-space: nowrap;
  }
  #refresh-btn:hover { background: rgba(56,189,248,0.1); }
  #refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error banner ── */
  #error-banner {
    display: none; padding: 8px 16px; background: rgba(248,113,113,0.15);
    border-bottom: 1px solid rgba(248,113,113,0.3);
    font-size: 12px; color: var(--red); font-family: var(--font-mono);
    text-align: center; z-index: 999;
  }

  /* ── Leaflet overrides ── */
  .leaflet-container { background: #0d1220; }
  /* ── Locate me button ── */
  #locate-btn {
    position: absolute; bottom: 24px; right: 12px; z-index: 1000;
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: background 0.15s;
  }
  #locate-btn:hover { background: var(--surface2); }
  #locate-btn.locating { color: var(--accent); animation: pulse-btn 1s infinite; }
  #locate-btn.located { color: var(--accent); }
  @keyframes pulse-btn { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  @media (max-width: 640px) {
    #locate-btn { bottom: 140px; }
  }

  .leaflet-control-zoom a {
    background: var(--surface) !important; color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-attribution {
    background: rgba(11,15,26,0.7) !important; color: var(--muted) !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  .tram-icon-outer {
    background: none !important; border: none !important; overflow: visible !important;
    cursor: pointer;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
    transition: filter 0.15s;
  }
  .tram-icon-outer:hover { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7)) brightness(1.25); }
  /* Red ring marks trams with a fresh, matched GPS reading (broadcasting) */
  .tram-icon-outer.gps-broadcasting svg circle { stroke: #ff3b30; stroke-width: 3; }
.tram-icon-outer.gps-broadcasting { filter: drop-shadow(0 0 4px rgba(255,59,48,0.6)); }
  /* PTV ghost ring (field test): cyan = PTV shows this run with no vehicle assigned */
  .tram-icon-outer.ptv-ghost svg circle { stroke: #00e5ff; stroke-width: 3; }
  .tram-icon-outer.ptv-ghost { filter: drop-shadow(0 0 4px rgba(0,229,255,0.7)); }
  .tram-icon-outer svg.selected { filter: drop-shadow(0 0 6px rgba(255,255,255,0.9)); }

  /* ── Mobile responsive ── */
  @media (max-width: 640px) {
    #sidebar { display: none; }
    #bottombar { display: flex; }
    #info-panel { top: 60px; bottom: auto; left: 10px; right: 10px; transform: none; min-width: unset; max-width: unset; max-height: 60vh; overflow-y: auto; }
  }

  /* ── Route group headers ── */
  .route-group-header {
    padding: 8px 14px 4px;
    font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase;
    color: #DCDCDC; font-family: var(--font-mono);
    border-top: 1px solid var(--border); margin-top: 4px;
  }
  .route-group-header:first-child { border-top: none; margin-top: 0; }

  /* mobile pills */
  .mobile-pill {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 22px; border-radius: 5px;
    font-weight: 700; font-size: 11px; font-family: var(--font-mono);
    color: #fff; cursor: pointer; opacity: 1; transition: opacity 0.2s;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .mobile-pill.dimmed { background: #4a5568 !important; opacity: 0.7; }

  #mobile-tram-count {
    font-family: var(--font-mono); font-size: 11px; color: var(--accent);
    margin-left: auto;
  }

  .sidebar-section { border-bottom: 1px solid var(--border); }
  .map-type-btn {
    flex: 1; padding: 6px 0; border-radius: 6px; font-size: 12px;
    font-family: var(--font-mono); cursor: pointer; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); transition: all 0.15s;
  }
  .map-type-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .sidebar-section-label {
    padding: 10px 14px 6px;
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #DCDCDC; font-family: var(--font-mono);
  }


  .all-btn {
    flex: 1; padding: 5px 0; border-radius: 6px; font-size: 11px;
    font-family: var(--font-mono); cursor: pointer;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    transition: background 0.15s;
  }
  .all-btn:hover { background: rgba(255,255,255,0.1); }

  /* ── Compass / orient-north button ── */
  #compass-btn {
    position: absolute; bottom: 72px; right: 12px; z-index: 1000;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); transition: background 0.15s;
  }
  #compass-btn:hover { background: var(--surface2); }
  #compass-rose {
    font-family: var(--font-mono); font-weight: 600; font-size: 12px;
    line-height: 1; display: flex; flex-direction: column; align-items: center;
    transition: transform 0.25s ease;
  }
  #compass-rose .tick { color: var(--red); font-size: 8px; margin-bottom: -2px; }
  @media (max-width: 640px) { #compass-btn { bottom: 188px; } }

  /* ── Service alerts ── */
  #alerts-btn {
    background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.45);
    color: var(--amber); padding: 3px 10px; border-radius: 20px;
    font-family: var(--font-mono); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #alerts-btn:hover { background: rgba(251,191,36,0.28); }
  #alerts-panel {
    position: fixed; top: 60px; right: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; font-size: 13px;
    z-index: 2000; width: 320px; max-width: calc(100vw - 24px);
    max-height: 70vh; overflow-y: auto; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #alerts-panel.visible { display: block; }
  .info-close-x {
    position: absolute; top: 8px; right: 12px; background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1;
  }
  .route-item.has-alert .route-name::after { content: ' ⚠'; color: var(--amber); font-size: 11px; }
</style>
</head>

  '70':  { name: 'Wattle Park – Waterfront City', color: '#F5A800', group: 'Flinders' },         // amber/gold
  '75':  { name: 'Vermont South – Etihad Stadium', color: '#F5A800', group: 'Flinders' },       // amber/gold (same as 70)

// ── Persistent route preferences ─────────────────────────────────────────────
const STORAGE_KEY = 'melbtrams_active_routes';
function loadSavedRoutes() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const arr = JSON.parse(saved);
      return new Set(arr.filter(id => ROUTE_DEFS[id]));

}

}

// ── State ────────────────────────────────────────────────────────────────────
let tileBase, tileLabels;
let mapStyle = (() => { try { return localStorage.getItem('melbtrams_map_style') || 'dark'; } catch(e) { return 'dark'; } })();

function setMapStyle(style) {
  mapStyle = style;
  try { localStorage.setItem('melbtrams_map_style', style); } catch(e) {}
  document.getElementById('btn-dark').classList.toggle('active', style === 'dark');
  document.getElementById('btn-light').classList.toggle('active', style === 'light');
  // Update mobile buttons
  document.getElementById('mb-dark')?.classList.toggle('active', style === 'dark');
  document.getElementById('mb-light')?.classList.toggle('active', style === 'light');

  map.removeLayer(tileBase);
  map.removeLayer(tileLabels);

  if (style === 'dark') {
    tileBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {

    }).addTo(map);
    tileLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
    }).addTo(map);
  } else {
    tileBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors © CARTO', subdomains: 'abcd', maxZoom: 19,

    tileLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
    }).addTo(map);
  }
  tileLabels.bringToFront();
}
let map, markers = {}, routeLayers = {}, activeRoutes = loadSavedRoutes();
let mapBearing = 0;          // current map rotation (deg), 0 = north up
let serviceAlerts = [];      // from Worker json.alerts (when available)
let selectedStop = null;
let selectedVehicle = null, refreshInterval = null;

// Route geodata loaded from tram_network.json
let TRAM_NETWORK = null;

// Schedule data loaded from schedule_*.json files
let SCHEDULE = null;  // merged schedule for today: {stops, trips, shapes}
let SCHEDULE_DAY = null;  // 'weekday' | 'saturday' | 'sunday'

// Timetable tram state: tramId → {routeId, tripId, lat, lng, bearing, schedPos}
let scheduleTrams = {};
let scheduleTimer = null;

// Trip delays from GTFS-RT Trip Updates feed: tripId → delaySecs
// Positive = running late, negative = running early
let tripDelays = {};  // populated from Worker response
// Per-stop delay change-points: tripId → [[stopId, delaySecs], ...]
// A delay applies from its stop onward until the next change-point (GTFS-RT semantics)
let tripStopDelays = {};
let LAST_LIVE_JSON = null;   // most recent worker payload, for re-translation
let FEED_TO_TRIP = {};       // feed tripId → resolved schedule trip (set per fetch)
let TRAM_META = {};          // tripKey → { model, gpsDelay, pingAge } from GPS feed
let GPS_CORR = {};           // tripKey → seconds to add to effective times (G-scaled), ringed trams only
let DRIFT_HIST = {};         // tripKey → [{delay, t(epoch)}] rolling 3 readings (persists across fetches) — feeds R

// ── Positioning dials (spec §3) ───────────────────────────────
// The five values that drive the position engine. Read once at boot from the
// remote config store (control plane) and clamped against DIAL_BOUNDS. If the
// fetch fails, is missing, or a value is out of range, the baked-in default for
// that dial stands. The control plane can NEVER take the viewer down.
//   G     GPS blend gain
//   RT    drift apply fraction   (the *computed* drift slope keeps the name R)
//   T     max ping age (seconds)
//   ORL   off-route limit (metres)
//   DWELL stop dwell time (seconds; scalar now, per-stop override map later)
const DIAL_BOUNDS = {
  G:     { min: -1, max: 2   },
  RT:    { min: 0,  max: 1   },
  T:     { min: 0,  max: 900 },
  ORL:   { min: 20, max: 200 },
  DWELL: { min: 0,  max: 120 }
};
const DEFAULT_DIALS = { G: 0.2, RT: 0.5, T: 420, ORL: 60, DWELL: 20 };
// Live dials store. Starts on baked defaults; loadConfig() may override at boot.
window.TUNING = { ...DEFAULT_DIALS };
// Debug surface (type WMT_DEBUG in the console): config provenance + GPS funnel.
window.WMT_DEBUG = { config: { source: 'baked', note: 'config fetch not completed yet' } };

// ── PULL: time-scheduled forward nudge for timetable-only trams ─────────────
// Field-experiment dial (baked for now; control-plane candidate later). Pulls
// TT dots forward in TIME; the schedule's own local pace converts that into
// distance, so the visible shift self-scales with traffic (large on fast quiet
// track, small in the slow city grid). Applies ONLY to trams with no live GPS
// correction this fetch — ringed trams are already placed by G/RT, and trams
// whose ring ages out fall back to the PULL-adjusted dot (softer than the old
// snap to pure TT). Stop/tram info panels are deliberately unaffected: PULL
// shifts the clock inside interpolateTrip, never the effective times.
const PULL_UNIT_SECS = 15;   // seconds per PULL unit (so PULL 2 = 30 s)

// Breakpoint tables: [hourOfDay 0-24, pullUnits], LOCAL wall-clock hours.
// Linear interpolation between points. Set all units to 0 to disable.
// Day type comes from getTodayType() (service-day convention: before 4am the
// previous day's table applies — both tables agree at those hours anyway).
// ── WEEKDAY table ──
const PULL_WEEKDAY = [[0,2],[6,2],[7,0],[18,0],[19,2],[24,2]];
// ── WEEKEND + PUBLIC HOLIDAY table (tweak independently by observation) ──
const PULL_WEEKEND = [[0,2],[6,2],[7,0],[18,0],[19,2],[24,2]];

function pullSecsNow() {
  const table = getTodayType() === 'weekday' ? PULL_WEEKDAY : PULL_WEEKEND;
  const d = new Date();
  const h = d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600;
  let units = table[table.length - 1][1];
  for (let i = 0; i < table.length - 1; i++) {
    const h0 = table[i][0], u0 = table[i][1];
    const h1 = table[i+1][0], u1 = table[i+1][1];
    if (h >= h0 && h <= h1) {
      units = (h1 === h0) ? u1 : u0 + (u1 - u0) * (h - h0) / (h1 - h0);
      break;
    }
  }
  return units * PULL_UNIT_SECS;
}

// Public GET /config on the config Worker (live). The viewer adopts these dials
// at load; on any failure it runs on the baked defaults above.
const CONFIG_URL = 'https://white-thunder-216b.wyliechat.workers.dev/config';

// P2 output beacons: anonymous interaction counters -> collector POST /beacon.
// Counters only (Model B), no ids, no coords; server assigns the UTC hour.
// Fire-and-forget: a beacon failure must never affect the map.
const BEACON_ENABLED = true;   // kill switch: set false + commit to stop emitting
const BEACON_URL = 'https://wmt-collector.wyliechat.workers.dev/beacon';
function wmtBeacon(e, d) {
  if (!BEACON_ENABLED) return;
  try { navigator.sendBeacon(BEACON_URL, JSON.stringify({ e: e, d: d === undefined ? '-' : String(d) })); } catch (err) {}
}

// ── PTV field probe (tram-tap enrichment) — FIELD TEST ONLY ──────────────────
// Off unless the URL carries ?ptv=<probe token>. When on, tapping a tram asks
// the collector's PTV probe about that tram's next stop (via the stop's GTFS id,
// gtfs=true), finds this run by route + scheduled time, and either shows the
// real TramTracker fleet number + PTV's delay when a vehicle is assigned, or
// rings the dot cyan when the run is in PTV's live window with NO vehicle (a
// ghost). Public users have no token → no PTV calls, no rings, no change.
const PTV_TOKEN = (() => { try { return new URLSearchParams(location.search).get('ptv'); } catch (e) { return null; } })();
const PTV_FIELD = !!PTV_TOKEN;
const PTV_PROBE_URL = 'https://weathered-limit-7615.wyliechat.workers.dev/ptv-probe';
// PTV route_id per app route number (from probe /v3/routes, 2026-07). 3a→3.
const PTV_ROUTE_ID = { '1':721,'109':722,'16':724,'19':725,'57':887,'59':897,
  '64':909,'67':913,'70':940,'72':947,'75':958,'78':976,'82':1002,'96':1041,
  '5':1083,'30':1880,'86':1881,'48':2903,'11':3343,'12':8314,'58':11529,
  '6':11544,'3':15833,'3a':15833,'35':15834 };

// "HH:MM:SS" (Melbourne wall clock) → service-day seconds, matching nowSecs():
// before 4am belongs to the previous service day, so it continues past 86400.
function ptvHmsToServiceSecs(hms) {
  const p = hms.split(':'); const h = +p[0];
  let sec = h * 3600 + (+p[1]) * 60 + (+p[2]);
  if (h < 4) sec += 86400;
  return sec;
}

// Which stop to ask PTV about. The next stop is the obvious choice, but if the
// tram is practically at it PTV has usually already dropped that departure from
// its list — and the nearest-match then slides onto the FOLLOWING service, which
// typically has no vehicle assigned yet. That is exactly the route 86 flicker:
// two taps 13 seconds apart returned two different runs. So skip ahead to the
// first stop at least PTV_LEAD_S away.
const PTV_LEAD_S = 90;
const PTV_MATCH_S = 90;               // +/- window for matching scheduled times
const PTV_STOP_TTL_MS = 60 * 1000;    // stop departures cached for a minute
const PTV_RUN_TTL_MS = 10 * 60 * 1000;
let PTV_STOP_CACHE = {};   // stopId  -> { at, table }
let PTV_RUN_CACHE  = {};   // tripKey -> { runRef, vehicle, delayMin, at }
const PTV_CALLS = { live: 0, cached: 0 };

function ptvQueryStopIdx(trip, cs) {
  const eff = effectiveStopTimes(trip);
  for (let i = 0; i < eff.length; i++) if (eff[i] - cs >= PTV_LEAD_S) return i;
  return -1;
}

// One request per stop per minute. Nearby trams share next stops, so this is
// where the call saving actually comes from: tapping five trams heading for the
// same stop is one request, not five.
async function ptvFetchStop(stopId) {
  const now = Date.now();
  const c = PTV_STOP_CACHE[stopId];
  if (c && now - c.at < PTV_STOP_TTL_MS) { PTV_CALLS.cached++; return c.table; }
  const url = PTV_PROBE_URL + '?token=' + encodeURIComponent(PTV_TOKEN) +
              '&stop_id=' + encodeURIComponent(stopId) + '&gtfs=1';
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('http ' + r.status);
  const data = await r.json();
  const table = (data && data.table) || [];
  PTV_STOP_CACHE[stopId] = { at: now, table: table };
  PTV_CALLS.live++;
  window.WMT_DEBUG.ptv = PTV_CALLS;
  return table;
}

// Resolve, applying the cache rule. A run never loses its tram, so a POSITIVE
// result outranks a later negative: a wrong-run match, an ambiguous pair or a
// PTV hiccup can no longer erase a good answer that has already been seen.
async function ptvResolve(trip, cs) {
  const qi = ptvQueryStopIdx(trip, cs);
  if (qi < 0) return { noStop: true };
  const res = await ptvLookup(trip, String(trip.stops[qi][0]),
                              trip.start + trip.stops[qi][1]);
  const key = tripKey(trip);
  const now = Date.now();
  if (res && res.vehicle) {
    PTV_RUN_CACHE[key] = { runRef: res.runRef, vehicle: res.vehicle,
                           delayMin: res.estimateDelayMin, delaySec: res.delaySec, at: now };
    return res;
  }
  const c = PTV_RUN_CACHE[key];
  if (c && now - c.at < PTV_RUN_TTL_MS) {
    return { matched: true, runRef: c.runRef, vehicle: c.vehicle,
             estimateDelayMin: c.delayMin, delaySec: c.delaySec,
             cachedS: Math.round((now - c.at) / 1000) };
  }
  return res;
}

// Ask the probe about `nextStopId` (a GTFS stop id, gtfs=true), find this trip's
// run by route + scheduled time (±90s, nearest), and report what PTV knows.
// Purely additive and defensive: any failure returns a soft result, never throws.
async function ptvLookup(trip, nextStopId, schedSecs) {
  const rid = PTV_ROUTE_ID[trip.routeId];
  if (!rid) return { matched: false };
  let table;
  try { table = await ptvFetchStop(nextStopId); }
  catch (e) { return { error: 'fetch' }; }
  let best = null, nearest = null, routeCount = 0, inWindow = 0;
  for (const d of table) {
    if (d.route_id !== rid || !d.scheduled_local) continue;
    routeCount++;
    const delta = Math.abs(ptvHmsToServiceSecs(d.scheduled_local) - schedSecs);
    if (nearest === null || delta < nearest) nearest = delta;
    if (delta <= PTV_MATCH_S) {
      inWindow++;
      if (!best || delta < best.delta) best = { d, delta };
    }
  }
  // Two services inside the window — route 11's ~24 twin pairs sit 60-120s apart
  // and do this routinely. We cannot tell which is ours, and naming the wrong
  // tram is worse than naming none, so say nothing.
  if (inWindow > 1) return { matched: false, ambiguous: true, inWindow: inWindow, nearest: nearest };
  if (!best) return { matched: false, routeCount: routeCount, nearest: nearest };
  const d = best.d;
  const horizon = ptvHmsToServiceSecs(d.scheduled_local) - nowSecs(); // secs until departure
  const hasVeh = !!(d.vehicle && d.vehicle.id);
  return {
    matched: true,
    runRef: d.run_ref,
    delta: Math.round(best.delta),
    vehicle: hasVeh ? d.vehicle : null,
    estimateDelayMin: (d.delay_min === undefined ? null : d.delay_min),
    // Seconds, derived from the two local strings — delay_min is minute-rounded
    // and too coarse to rebuild an arrival time from.
    delaySec: (d.estimated_local && d.scheduled_local)
      ? ptvHmsToServiceSecs(d.estimated_local) - ptvHmsToServiceSecs(d.scheduled_local)
      : null,
    // Ghost = in PTV's live window (out to ~25 min, allow 5 min slack behind) with no vehicle.
    isGhost: !hasVeh && horizon <= 1500 && horizon >= -300
  };
}

// Fill the panel from PTV where it has something to say, leaving the engine's
// own numbers in place where it does not. PTV takes priority for Arrives and
// Running so the two can never contradict each other; Source gains "+ PTV" as
// the provenance flag; the Tram Number row is PTV-only by nature.
// Dot positions are untouched — PTV never enters the positioning engine.
const PTV_FRESH_S = 90;   // a cached delay older than this is stale: number only

async function ptvApply(tramId, trip, nextStopIdx) {
  if (!PTV_FIELD) return;
  const panel = document.getElementById('info-content');
  if (panel) panel.insertAdjacentHTML('beforeend',
    '<div class="info-row"><span class="info-label">Tram Number</span>' +
    '<span class="info-value" id="wmt-tramnum" style="font-family:var(--font-mono);font-size:11px;color:#64748b">checking\u2026</span></div>');

  const set = (id, html, color) => {
    if (selectedVehicle !== tramId) return;        // user moved to another tram
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = html;
    if (color) el.style.color = color;
  };
  const ring = (on) => {
    const mk = scheduleTrams[tramId];
    const icon = mk && mk.marker && mk.marker._icon;
    if (!icon) return;
    if (on && !icon.classList.contains('gps-broadcasting')) icon.classList.add('ptv-ghost');
    if (!on) icon.classList.remove('ptv-ghost');
  };
  const dim = (s) => ' <span style="opacity:0.55">\u00b7 ' + s + '</span>';

  const res = await ptvResolve(trip, nowSecs());
  if (selectedVehicle !== tramId) return;

  // ── Tram Number ──
  if (res && res.vehicle && res.vehicle.id) {
    // run_ref + match delta are diagnostics, not rider information: recorded for
    // the console, and shown only as "cached" when the number is held, not live.
    window.WMT_DEBUG.ptvLast = { route: trip.routeId, tram: res.vehicle.id,
      run: res.runRef, matchDeltaS: res.delta, delaySec: res.delaySec,
      cachedS: res.cachedS, at: new Date().toLocaleTimeString() };
    set('wmt-tramnum', res.vehicle.id +
        (res.cachedS !== undefined ? dim('cached ' + res.cachedS + 's') : ''),
        'var(--text)');
    // PTV knows this vehicle's own fit-out, which beats the class-level guess in
    // TRAM_ACCESS — and carries the line on its own when GTFS-RT gave no class.
    const acc = (res.vehicle.low_floor === true) ? 'Low floor'
              : (res.vehicle.low_floor === false) ? 'High floor (steps)' : null;
    const air = (res.vehicle.air_conditioned === true) ? ', a/c' : '';
    if (acc) {
      const m = TRAM_META[tripKey(trip)];
      const cls = (m && m.model) ? 'Tram model ' + m.model + ' \u2013 ' : '';
      set('wmt-model', cls + acc + air);
    }
  } else {
    const why = (!res || res.error) ? 'unavailable'
      : res.noStop    ? 'no upcoming stop'
      : res.ambiguous ? 'ambiguous, ' + res.inWindow + ' runs'
      : res.matched   ? 'run ' + res.runRef + ', no vehicle'
      : res.routeCount ? 'nearest ' + Math.round(res.nearest) + 's off'
      : 'no ' + trip.routeId + ' run at that stop';
    set('wmt-tramnum', 'Not available' + dim(why), '#94a3b8');
  }

  // ── Ghost ring: unchanged rules, GPS still outranks PTV silence ──
  if (res && res.matched && res.isGhost) {
    const mk = scheduleTrams[tramId];
    const icon = mk && mk.marker && mk.marker._icon;
    ring(!(icon && icon.classList.contains('gps-broadcasting')));
  } else {
    ring(false);
  }

  // ── PTV drives Arrives + Running when it has a live opinion ──
  // A cached vehicle id stays valid for the whole trip, but a cached DELAY goes
  // stale fast — so past PTV_FRESH_S we keep the number and leave the engine's
  // timing alone rather than showing an old estimate as current.
  if (!res || !res.matched) return;
  if (res.delaySec === null || res.delaySec === undefined) return;
  if (res.cachedS !== undefined && res.cachedS > PTV_FRESH_S) return;

  const srcEl = document.getElementById('wmt-source');
  if (srcEl && srcEl.textContent.indexOf('PTV') === -1) {
    srcEl.textContent = srcEl.textContent + ' + PTV';
  }

  const mins = Math.round(res.delaySec / 60);
  const label = mins > 2 ? mins + ' min late'
              : mins < -1 ? Math.abs(mins) + ' min early' : 'On time';
  const color = mins > 2 ? '#f87171' : mins < -1 ? '#34d399' : '#94a3b8';
  set('wmt-running', label, color);

  if (nextStopIdx >= 0) {
    const arr = trip.start + trip.stops[nextStopIdx][1] + res.delaySec;
    const away = Math.round((arr - nowSecs()) / 60);
    const loc = ((arr % 86400) + 86400) % 86400;
    const hh = String(Math.floor(loc / 3600) % 24).padStart(2, '0');
    const mm = String(Math.floor((loc % 3600) / 60)).padStart(2, '0');
    set('wmt-arrives', hh + ':' + mm + ' (' + (away <= 0 ? 'now' : away + ' min') + ')', '#34d399');
  }
}

// Called after a tram panel renders (field mode only). Injects a PTV line, then
// fills it — and toggles the cyan ghost ring — when the lookup resolves.
async function ptvEnrich(tramId, trip, nextStopIdx) {
  if (!PTV_FIELD) return;
  const panel = document.getElementById('info-content');
  if (panel) panel.insertAdjacentHTML('beforeend',
    '<div class="info-row" id="ptv-line"><span class="info-label">PTV</span>' +
    '<span class="info-value" style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">checking\u2026</span></div>');
  const setLine = (html, color) => {
    const el = document.getElementById('ptv-line');
    if (!el || selectedVehicle !== tramId) return;   // user moved to another tram
    const v = el.querySelector('.info-value');
    v.innerHTML = html;
    if (color) v.style.color = color;
  };
  const ring = (on) => {
    const mk = scheduleTrams[tramId];
    const icon = mk && mk.marker && mk.marker._icon;
    if (!icon) return;
    if (on && !icon.classList.contains('gps-broadcasting')) icon.classList.add('ptv-ghost');
    if (!on) icon.classList.remove('ptv-ghost');
  };
 // nextStopIdx is superseded by ptvQueryStopIdx (lead time), kept in the
  // signature so the call site in showScheduleInfo is unchanged.
  const res = await ptvResolve(trip, nowSecs());
  if (!res || res.error) { setLine('unavailable', '#94a3b8'); return; }
  if (res.noStop) { setLine('no upcoming stop', '#94a3b8'); return; }
  if (res.ambiguous) {
    setLine('ambiguous \u00b7 ' + res.inWindow + ' runs in window', '#94a3b8'); ring(false); return;
  }
if (!res.matched) {
    const why = res.routeCount
      ? 'no match \u00b7 nearest ' + Math.round(res.nearest) + 's off'
      : 'no ' + trip.routeId + ' run at this stop';
    setLine(why, '#94a3b8'); ring(false); return;
  }  if (res.vehicle) {
    ring(false);
    const acc = res.vehicle.low_floor ? 'low-floor' : 'high-floor';
    const air = res.vehicle.air_conditioned ? ', a/c' : '';
    const del = (res.estimateDelayMin == null) ? ''
      : res.estimateDelayMin > 2 ? ' \u00b7 ' + res.estimateDelayMin + ' min late'
      : res.estimateDelayMin < -1 ? ' \u00b7 ' + Math.abs(res.estimateDelayMin) + ' min early'
      : ' \u00b7 on time';
    const tag = (res.cachedS !== undefined) ? ' \u00b7 cached ' + res.cachedS + 's'
              : ' \u00b7 run ' + res.runRef + ' \u00b1' + res.delta + 's';
    setLine('Tram ' + res.vehicle.id + ' (' + acc + air + ')' + del + tag, '#34d399');
  } else if (res.isGhost) {
    // A red-ringed tram is broadcasting GPS — already proven real. PTV having no
    // vehicle on the matched run then means a feed gap or a wrong-twin match, NOT
    // a ghost: never cyan it or call it one. GPS is the stronger evidence.
    const gmk = scheduleTrams[tramId];
    const gicon = gmk && gmk.marker && gmk.marker._icon;
    if (gicon && gicon.classList.contains('gps-broadcasting')) {
      ring(false);
      setLine('GPS live \u00b7 no TramTracker vehicle \u00b7 run ' + res.runRef, '#94a3b8');
    } else {
      ring(true);
      setLine('no vehicle assigned \u2014 possible ghost \u00b7 run ' + res.runRef, '#00e5ff');
    }
  } else {
    ring(false);
    setLine('scheduled, awaiting vehicle', '#94a3b8');
  }
}

// Fetch remote dials, validate each against DIAL_BOUNDS, override defaults.
// Any failure (network, timeout, bad JSON, out-of-range, unknown key) is
// swallowed and the affected dial keeps its baked default. Never blocks boot.
async function loadConfig() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3000);
    const res = await fetch(CONFIG_URL, { signal: ctrl.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (!res.ok) { window.WMT_DEBUG.config = { source: 'baked', note: 'config HTTP ' + res.status }; return; }
    const cfg = await res.json();
    const dials = cfg && cfg.dials;
    if (!dials || typeof dials !== 'object') { window.WMT_DEBUG.config = { source: 'baked', note: 'config response missing dials' }; return; }
    for (const k in DIAL_BOUNDS) {
      const v = dials[k], b = DIAL_BOUNDS[k];
      if (typeof v === 'number' && isFinite(v) && v >= b.min && v <= b.max) {
        window.TUNING[k] = v;   // accept known, in-range value
      }                          // else keep the baked default for this dial
    }
    // Unknown keys in cfg.dials are ignored by construction.
    window.WMT_DEBUG.config = { source: 'remote', v: cfg.v, dials: { ...window.TUNING } };
  } catch (e) { window.WMT_DEBUG.config = { source: 'baked', note: 'config fetch failed: ' + (e && e.message || e) }; }
}

// Rolling-stock class → boarding accessibility (shown in the tram info panel)
const TRAM_ACCESS = {
  'E': 'Low floor accessible',  'E2': 'Low floor accessible',
  'C1': 'Low floor accessible', 'C2': 'Low floor accessible',
  'D1': 'Low floor accessible', 'D2': 'Low floor accessible',
  'A1': 'High floor (steps)',   'A2': 'High floor (steps)',
  'B1': 'High floor (steps)',   'B2': 'High floor (steps)',
  'Z3': 'High floor (steps)',   'W':  'High floor heritage (steps)'
};
let lastFetchOk = 0;            // Date.now() of last successful Worker fetch
let lastStopPanelRender = 0;    // nowSecs() of last stop-panel render (for live refresh)

// Victorian public holidays 2026. Trams generally run a Saturday timetable on
// public holidays, except Good Friday + Christmas Day which run Sunday timetables.
// (2026-09-25 = AFL Grand Final Friday — verify once AFL confirms the date.)
const VIC_HOLIDAYS_SUNDAY = new Set(['20260403','20261225']);
const VIC_HOLIDAYS_SATURDAY = new Set([
  '20260101','20260126','20260309','20260404','20260406','20260425',
  '20260608','20260925','20261103','20261226','20261228'
]);

function getTodayType() {
  // "Service day": before 4am counts as the previous day, matching GTFS >24h
  // times (a 1:30am tram belongs to yesterday's timetable as 25:30).
  const d = new Date(Date.now() - 4*3600*1000);
  const ds = '' + d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  if (VIC_HOLIDAYS_SUNDAY.has(ds)) return 'sunday';
  if (VIC_HOLIDAYS_SATURDAY.has(ds)) return 'saturday';
  const dow = d.getDay(); // 0=Sun, 6=Sat
  if (dow === 0) return 'sunday';
  if (dow === 6) return 'saturday';
  return 'weekday';
}

function nowSecs() {
  // Seconds since *service day* start: between midnight and 4am we are still on
  // yesterday's timetable, so the clock continues past 86400 (GTFS >24h times)
  const d = new Date();
  let s = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
  if (d.getHours() < 4) s += 86400;
  return s;
}


// Find position on a shape geometry at a given distance along the path
function posOnShape(shape, dist) {
  if (!shape || shape.length === 0) return null;
  // Clamp paths must still return a bearing — omitting it produced
  // rotate(NaN) errors for every tram sitting at a route terminus.
  if (dist <= shape[0][2]) {
    const b = shape.length > 1 ? calcBearing(shape[0][0], shape[0][1], shape[1][0], shape[1][1]) : 0;
    return { lat: shape[0][0], lng: shape[0][1], bearing: b };
  }
  if (dist >= shape[shape.length-1][2]) {
    const p = shape[shape.length-1], q = shape.length > 1 ? shape[shape.length-2] : p;
    return { lat: p[0], lng: p[1], bearing: shape.length > 1 ? calcBearing(q[0], q[1], p[0], p[1]) : 0 };
  }
  // Binary search for segment
  let lo = 0, hi = shape.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (shape[mid][2] <= dist) lo = mid; else hi = mid;
  }
  const p0 = shape[lo], p1 = shape[hi];
  const segLen = p1[2] - p0[2];
  const frac = segLen > 0 ? (dist - p0[2]) / segLen : 0;
  return {
    lat: p0[0] + (p1[0] - p0[0]) * frac,
    lng: p0[1] + (p1[1] - p0[1]) * frac,
    bearing: calcBearing(p0[0], p0[1], p1[0], p1[1])
  };
}

// ── Tier 2: GPS as a delay sensor (console-only this build) ──────────────────
// Each GPS ping carries its own timestamp, so staleness doesn't matter: we ask
// where the schedule said this trip should have been AT THE PING'S MOMENT and
// convert the along-shape gap to seconds. Readings older than TUNING.T or
// further than TUNING.ORL from the shape are discarded (dead transponders
// hold their last position in this feed — see the 47-minute route 48 ping).

// Inverse shape projection: nearest point on shape → cumulative distance + offset
function projectOnShape(shape, lat, lng) {
  if (!shape || shape.length < 2) return null;
  const mLat = 111320, mLng = 111320 * Math.cos(lat * Math.PI / 180);
  let bestOff2 = Infinity, bestDist = 0;
  for (let i = 0; i < shape.length - 1; i++) {
    const ax = (shape[i][1] - lng) * mLng,   ay = (shape[i][0] - lat) * mLat;
    const bx = (shape[i+1][1] - lng) * mLng, by = (shape[i+1][0] - lat) * mLat;
    const dx = bx - ax, dy = by - ay;
    const L2 = dx*dx + dy*dy;
    let t = L2 > 0 ? -(ax*dx + ay*dy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = ax + dx*t, py = ay + dy*t;
    const off2 = px*px + py*py;
    if (off2 < bestOff2) {
      bestOff2 = off2;
      bestDist = shape[i][2] + (shape[i+1][2] - shape[i][2]) * t;
    }
  }
  return { dist: bestDist, off: Math.sqrt(bestOff2) };
}

// Scheduled (raw, no delays) service-day seconds at a given shape distance
function schedSecsAtDist(trip, dist) {
  const st = trip.stops;
  if (dist <= st[0][2]) return trip.start + st[0][1];
  for (let i = 0; i < st.length - 1; i++) {
    if (dist <= st[i+1][2]) {
      const d0 = st[i][2], d1 = st[i+1][2];
      const f = d1 > d0 ? (dist - d0) / (d1 - d0) : 0;
      return trip.start + st[i][1] + (st[i+1][1] - st[i][1]) * f;
    }
  }
  return trip.start + st[st.length-1][1];
}

// Inverse of schedSecsAtDist: a scheduled service-day time → shape distance.
// Used to place the R-projected "position now" debug point back on the route.
function distAtSchedSecs(trip, sec) {
  const st = trip.stops;
  const rel = sec - trip.start;
  if (rel <= st[0][1]) return st[0][2];
  for (let i = 0; i < st.length - 1; i++) {
    if (rel <= st[i+1][1]) {
      const t0 = st[i][1], t1 = st[i+1][1];
      const f = t1 > t0 ? (rel - t0) / (t1 - t0) : 0;
      return st[i][2] + (st[i+1][2] - st[i][2]) * f;
    }
  }
  return st[st.length-1][2];
}

// Physical bounds on the drift rate. A tram can lose time arbitrarily fast (sat
// at a red light = +1 s per s) but can only make it up as fast as schedule slack
// allows. Unclamped, a least-squares fit over two jittery pings produces slopes
// implying teleportation — which then gets multiplied by ping age.
const R_MIN = -0.3, R_MAX = 1.0;
// Past this ping age the R-extrapolation is guesswork, so hold it flat instead
// of projecting ever further forward as a transponder goes quiet.
const DRIFT_CAP_S = 90;

// ── Correction easing (1 Hz) ────────────────────────────────────────────────
// gpsDelaySensor publishes a TARGET correction each fetch (every 10s); the dot
// follows it here, once per second, at a bounded rate. Two things this buys:
// a large correction arrives as a slide rather than a hop, and a tram that stops
// passing the GPS gates fades out over several seconds instead of snapping back
// to pure timetable in a single frame — the "half way to the next stop, then
// back to the last one" artifact.
// Rest position is -pullSecsNow(), not 0: PULL shifts the clock forward while
// GPS_CORR shifts stop times back, so -pull is the correction that holds the dot
// exactly where PULL will hold it once the key is dropped. No step at handoff.
let GPS_TARGET = {};         // tripKey → wanted correction, rebuilt every fetch
const SLEW_PER_SEC  = 1.5;   // max change per second while tracking a live target
const DECAY_PER_SEC = 1.0;   // max change per second while fading out

function slewToward(from, to, limit) {
  const d = to - from;
  if (d >  limit) return from + limit;
  if (d < -limit) return from - limit;
  return to;
}

function easeCorrections() {
  const next = {};
  let tracking = 0, fading = 0;
  for (const key in GPS_TARGET) {
    const prev = GPS_CORR[key];
    next[key] = (prev === undefined) ? GPS_TARGET[key]
                                     : slewToward(prev, GPS_TARGET[key], SLEW_PER_SEC);
    tracking++;
  }
  const rest = -pullSecsNow();
  for (const key in GPS_CORR) {
    if (key in next) continue;
    const moved = slewToward(GPS_CORR[key], rest, DECAY_PER_SEC);
    if (Math.abs(moved - rest) >= 0.5) { next[key] = moved; fading++; }   // else drop: PULL takes over
  }
  GPS_CORR = next;
  const g = window.WMT_DEBUG.gps;
  if (g) { g.tracking = tracking; g.fading = fading; }
}

// ── Jump watch (diagnostic) ─────────────────────────────────────────────────
// "Does it jump when I'm not looking?" — yes: the animation loop repositions
// every tram every second whether a panel is open or not. This counts backward
// moves along the route so the rate can be read rather than guessed. Leave the
// map open a while, then type WMT_DEBUG.jumps.
const JUMP_MIN_M = 30;    // ignore sub-30m wobble; a real snap is far bigger
let JUMP_LAST = {};       // tramId → last along-route distance
function watchJump(tramId, routeId, pos) {
  const j = window.WMT_DEBUG.jumps ||
            (window.WMT_DEBUG.jumps = { count: 0, worstM: 0, worstRoute: null, last: null });
  const prev = JUMP_LAST[tramId];
  if (typeof prev === 'number' && typeof pos.dist === 'number') {
    const back = prev - pos.dist;
    if (back > JUMP_MIN_M) {
      j.count++;
      j.last = { route: routeId, backM: Math.round(back), at: new Date().toLocaleTimeString() };
      if (back > j.worstM) { j.worstM = Math.round(back); j.worstRoute = routeId; }
    }
  }
  if (typeof pos.dist === 'number') JUMP_LAST[tramId] = pos.dist;
}

// Least-squares slope of delay-vs-time over the rolling window → R (sec/sec).
// Best-fit beats endpoint-difference: one jittery reading gets averaged down
// instead of dominating. Origin-shifted for numerical stability.
function driftSlope(pts) {
  const n = pts.length;
  if (n < 2) return 0;
  const t0 = pts[0].t;
  let st = 0, sd = 0, stt = 0, std = 0;
  for (const p of pts) {
    const x = p.t - t0;
    st += x; sd += p.delay; stt += x*x; std += x*p.delay;
  }
  const den = n*stt - st*st;
  return den !== 0 ? (n*std - st*sd) / den : 0;
}

// Per fetch: compute observed GPS delays, log vs Trip Updates, harvest tram models.
function gpsDelaySensor(json) {
  if (!SCHEDULE || !TRAM_NETWORK) return;
  const nowEpoch = Math.floor(Date.now() / 1000);
  const csNow = nowSecs();
  const meta = {};
  GPS_TARGET = {};   // wanted correction, rebuilt every fetch; GPS_CORR eases toward it
  // Drop drift history for trips gone quiet > 15 min (dead transponder / finished)
  const pruneBefore = nowEpoch - 900;
  for (const dk in DRIFT_HIST) {
    const h = DRIFT_HIST[dk];
    if (!h.length || h[h.length-1].t < pruneBefore) delete DRIFT_HIST[dk];
  }
  const dbg = { vehicles: (json.vehicles || []).length, matched: 0, fresh: 0, onRoute: 0, corrected: 0 };
  (json.vehicles || []).forEach(v => {
    const trip = FEED_TO_TRIP[v.tripId];
    if (!trip) return;
    dbg.matched++;
    const key = tripKey(trip);
    if (v.vehicleLabel) (meta[key] = meta[key] || {}).model = v.vehicleLabel;
    if (!v.ts) return;
    const age = nowEpoch - v.ts;
    if (age > TUNING.T) return;
    dbg.fresh++;
    const dirs = TRAM_NETWORK.routes[trip.routeId];
    const shape = dirs ? (dirs[String(trip.dir)] || dirs['0']) : null;
    if (!shape) return;
    const proj = projectOnShape(shape, v.lat, v.lng);
    if (!proj || proj.off > TUNING.ORL) return;
    dbg.onRoute++;
    const pingSecs = csNow - age;   // service-day seconds at the ping's moment
    const obs = Math.round(pingSecs - schedSecsAtDist(trip, proj.dist));
    const tu = tripDelays[key];
    const m = (meta[key] = meta[key] || {});
    m.gpsDelay = obs; m.pingAge = age;
    // ── Drift (R): rolling 3-reading window, least-squares slope ──
    // Dedup on ping timestamp — the 30s feed cache repeats a ping across our
    // 10s fetches; only genuinely new pings advance the window.
    const hist = DRIFT_HIST[key] || (DRIFT_HIST[key] = []);
    if (!hist.length || hist[hist.length-1].t !== v.ts) {
      hist.push({ delay: obs, t: v.ts });
      if (hist.length > 3) hist.shift();
    }
    let R = 0;
    if (hist.length >= 2) {
      const span = hist[hist.length-1].t - hist[0].t;   // freshness/usability guard
 if (span >= 20 && span <= 600) R = driftSlope(hist);
    }
    if (R < R_MIN) R = R_MIN; else if (R > R_MAX) R = R_MAX;   // physical clamp
    m.driftR = R;
    // ── Position correction (the secret sauce) ──
    // tuBase = the operator's Trip-Updates delay (our baseline). Distrust GPS
    // readings that disagree with it absurdly (>20 min = teleport/bad match) —
    // those revert to pure timetable.
    // G blends the dot from timetable (0) toward GPS-observed delay (1).
    // RT then slides the dot a further fraction (TUNING.RT) of the way toward the
    // full drift-projected "arrow" delay (obs + slope·age) — latency + drift.
    // TUNING.RT = 0 → G-only (old behaviour); 1 → all the way to the arrow tip.
    const tuBase = (tu === undefined ? 0 : tu);
    if (Math.abs(obs - tuBase) <= 1200) {
      const gCorr = TUNING.G * (obs - tuBase);          // G-only delay offset
// Taper: unbounded, a quiet transponder grows `age` ~10s per fetch while
      // obs stays fixed, so the dot creeps forward every frame and then falls
      // off a cliff when age crosses T. Past DRIFT_CAP_S, hold the projection flat.
      const arrowDelay = obs + R * Math.min(age, DRIFT_CAP_S);      const dotDelay = tuBase + gCorr;                  // where the dot sits on G alone
      GPS_TARGET[key] = gCorr + TUNING.RT * (arrowDelay - dotDelay);
      dbg.corrected++;
    }
  });
  TRAM_META = meta;   // replaced wholesale each fetch, same lifecycle as delays
  window.WMT_DEBUG.gps = Object.assign(dbg, {
    feedDelays: json.delayCount || 0,
    at: new Date().toLocaleTimeString(),
  });
}

// ── Live-delay matching ──────────────────────────────────────────────────────
// Feed trip ids come from a different static-GTFS generation than the schedule
// JSONs, so they never match directly. Instead we match by (route, start time),
// using the worker's tripStarts meta, and key the live-delay maps by a stable
// composite: route_dir_start. ~8% of route+start pairs have trips in BOTH
// directions starting the same second; those are disambiguated by the feed's
// stopIds (Melbourne stops are direction-specific). Still ambiguous → skipped.

function tripKey(trip) {
  return trip.routeId + '_' + trip.dir + '_' + trip.start;
}

let SCHED_INDEX = {};   // routeId → Map(startSecs → [trips, unique by dir])
function buildSchedIndex() {
  SCHED_INDEX = {};
  if (!SCHEDULE) return;
  Object.entries(SCHEDULE.trips).forEach(([routeId, trips]) => {
    const m = new Map();
    const seen = new Set();
    for (const t of trips) {
      const k = t.dir + '_' + t.start;
      if (seen.has(k)) continue;
      seen.add(k);
      let arr = m.get(t.start);
      if (!arr) m.set(t.start, arr = []);
      arr.push(t);
    }
    SCHED_INDEX[routeId] = m;
  });
}

// json → { delays: {compositeKey→secs}, stopDelays: {compositeKey→changePoints} }
function translateLiveDelays(json) {
  const delays = {}, stopDelays = {}, feedToTrip = {};
  const starts = json.tripStarts || {};
  if (!SCHEDULE) return { delays, stopDelays, feedToTrip };
  let matched = 0, ambiguous = 0, unmatched = 0;
  for (const ftid in starts) {
    const meta = starts[ftid];
    const route = meta[0], startSecs = meta[1];
    const idx = SCHED_INDEX[route];
    if (!idx) { unmatched++; continue; }
    // Overnight: feed may report real-clock start while the (yesterday)
    // schedule uses >24h times — try the +86400 variant as fallback
    let cands = idx.get(startSecs) || idx.get(startSecs + 86400);
    if (!cands || !cands.length) { unmatched++; continue; }
    let chosen = null;
    if (cands.length === 1) {
      chosen = cands[0];
    } else {
      // Both directions start this second — disambiguate via feed stopIds
      const cps = json.stopDelays && json.stopDelays[ftid];
      if (cps && cps.length) {
        const ids = cps.map(c => String(c[0]));
        const hits = cands.filter(t => {
          const set = new Set(t.stops.map(s => String(s[0])));
          return ids.every(id => set.has(id));
        });
        if (hits.length === 1) chosen = hits[0];
      }
      if (!chosen) { ambiguous++; continue; }   // conservative: no data beats wrong data
    }
    const key = tripKey(chosen);
    feedToTrip[ftid] = chosen;
    matched++;
    if (json.delays && ftid in json.delays) delays[key] = json.delays[ftid];
    if (json.stopDelays && json.stopDelays[ftid]) stopDelays[key] = json.stopDelays[ftid];
  }
  return { delays, stopDelays, feedToTrip };
}

// Effective per-stop times for a trip: schedule + per-stop GTFS-RT delays.
// Uses change-points from tripStopDelays (a delay carries forward until the
// next specified stop). Falls back to the whole-trip delay when per-stop data
// is absent, and keeps times monotonic (a tram can't arrive before it left).
function effectiveStopTimes(trip) {
  const stops = trip.stops;
  const out = new Array(stops.length);
  const k = tripKey(trip);
  const corr = GPS_CORR[k] || 0;   // G-scaled GPS correction (0 unless ringed)
  const sd = tripStopDelays[k];
  if (!sd || !sd.length) {
    const base = (tripDelays[k] || 0) + corr;
    for (let i = 0; i < stops.length; i++) out[i] = trip.start + stops[i][1] + base;
    return out;
  }
  const change = {};
  for (const cp of sd) change[String(cp[0])] = cp[1];
  let cur = sd[0][1]; // stops before the first change-point: use first known delay
  for (let i = 0; i < stops.length; i++) {
    const d = change[String(stops[i][0])];
    if (d !== undefined) cur = d;
    let t = trip.start + stops[i][1] + cur + corr;
    if (i > 0 && t < out[i-1] + 1) t = out[i-1] + 1; // monotonic guard
    out[i] = t;
  }
  return out;
}

// Given a trip and current time, return interpolated {lat, lng, bearing} or null
// Uses shape geometry for smooth path-following
// Positions are driven by per-stop effective times (schedule + live delays)
function interpolateTrip(trip, stops_dict, network_routes, currentSecs) {
  const tripStops = trip.stops; // [stop_id, delta_secs, shape_dist]

  // PULL: timetable-only trams are evaluated pullSecsNow() seconds ahead of
  // the real clock. Ringed trams (live GPS_CORR entry) are exempt — G/RT owns
  // them; when a ring ages out the tram lands here and inherits the pull.
  if (GPS_CORR[tripKey(trip)] === undefined) currentSecs += pullSecsNow();

  // Effective (delay-adjusted) absolute times for each stop
  const absTimes = effectiveStopTimes(trip);
  const tripEnd  = absTimes[absTimes.length - 1];

  // Not active yet or already finished
  if (currentSecs < absTimes[0] - 120) return null;
  if (currentSecs > tripEnd + 120) return null;

  // Get shape geometry for this trip (route + direction)
  const routeDirs = network_routes[trip.routeId];
  const shape = routeDirs ? (routeDirs[String(trip.dir)] || routeDirs['0']) : null;

  // Find which inter-stop segment we're in
  let segIdx = -1;
  for (let i = 0; i < absTimes.length - 1; i++) {
    if (currentSecs >= absTimes[i] && currentSecs <= absTimes[i+1]) {
      segIdx = i; break;
    }
  }

  // Before first stop
  if (segIdx === -1 && currentSecs < absTimes[0]) {
    const d0 = tripStops[0][2];
    if (shape) {
      const p = posOnShape(shape, d0);
      return { lat: p.lat, lng: p.lng, bearing: p.bearing, atStop: true, dist: d0 };
    }
    const s = stops_dict[String(tripStops[0][0])];
    if (!s) return null;
    return { lat: s[0], lng: s[1], bearing: 0, atStop: true };
  }

  // After last stop
  if (segIdx === -1) {
    const dLast = tripStops[tripStops.length-1][2];
    if (shape) {
 const p = posOnShape(shape, dLast);
      return { lat: p.lat, lng: p.lng, bearing: p.bearing, atStop: true, dist: dLast };
    }
    const s = stops_dict[String(tripStops[tripStops.length-1][0])];
    if (!s) return null;
    return { lat: s[0], lng: s[1], bearing: 0, atStop: true };
  }

  // Interpolate shape distance between the two stops
  // Tram dwells at the departure stop for DWELL_SECS, then travels faster to
  // cover the full distance in the remaining time — more natural than constant speed
  const DWELL_SECS = TUNING.DWELL;
  const t0 = absTimes[segIdx], t1 = absTimes[segIdx+1];
  const segDuration = t1 - t0;
  const elapsed = currentSecs - t0;
  const d0 = tripStops[segIdx][2], d1 = tripStops[segIdx+1][2];

  let frac, dwellingAtStop;
  if (segDuration > DWELL_SECS + 5 && elapsed <= DWELL_SECS) {
    // Still dwelling at the departure stop
    frac = 0;
    dwellingAtStop = true;
  } else if (segDuration > DWELL_SECS + 5) {
    // Travelling — compress journey into (segDuration - DWELL_SECS) seconds
    const travelTime = segDuration - DWELL_SECS;
    frac = Math.max(0, Math.min(1, (elapsed - DWELL_SECS) / travelTime));
    dwellingAtStop = false;
  } else {
    // Short segment (< 25s) — normal linear interpolation, no room for dwell
    frac = segDuration > 0 ? Math.max(0, Math.min(1, elapsed / segDuration)) : 0;
    dwellingAtStop = false;
  }

  const dist = d0 + (d1 - d0) * frac;

  if (shape) {
  const p = posOnShape(shape, dist);
    return { lat: p.lat, lng: p.lng, bearing: p.bearing, atStop: dwellingAtStop, dist: dist };
  }

  // Fallback: straight line between stops if no shape
  const s0 = stops_dict[String(tripStops[segIdx][0])];
  const s1 = stops_dict[String(tripStops[segIdx+1][0])];
  if (!s0 || !s1) return null;
  return {
    lat: s0[0] + (s1[0] - s0[0]) * frac,
    lng: s0[1] + (s1[1] - s0[1]) * frac,
    bearing: calcBearing(s0[0], s0[1], s1[0], s1[1]),
    atStop: dwellingAtStop
  };
}

// Find active trips right now for all routes
// Deduplicates by (route, direction, start_time) since schedule contains
// multiple service_id variants (Mon/Tue/Wed etc) for the same physical service
function getActiveTrips(currentSecs) {
  if (!SCHEDULE) return [];
  const active = [];

  Object.entries(SCHEDULE.trips).forEach(([routeId, tripList]) => {
    const seen = new Set(); // deduplicate within this route
    tripList.forEach((trip, idx) => {
      const tripStart = trip.start;
      const tripEnd   = tripStart + trip.stops[trip.stops.length-1][1];
      if (currentSecs >= tripStart && currentSecs <= tripEnd + 60) {
        // Key: direction + start_time uniquely identifies a physical service
        const key = trip.dir + '_' + trip.start;
        if (!seen.has(key)) {
          seen.add(key);
          active.push({ routeId, trip, idx });
        }
      }
    });
  });
  return active;
}

// ── Map init ─────────────────────────────────────────────────────────────────
function makeTramSVG(routeId, color, bearing, vehicleId) {
  // Circle with protruding arrow triangle pointing in direction of travel
  // SVG is 36x36, everything centred at 18,18
  // Arrow points UP at 0deg (north), rotates clockwise
  const r = 11; // circle radius
  const fs = routeId.length > 2 ? 7 : 9; // font size
  // Arrow triangle: tip at top, base overlapping circle edge
  const tipY = -(r + 12);  // sharp tip extends beyond circle
  const baseY = -(r - 3);  // base sits inside circle edge
  const baseW = 7.5;        // half-width of base
  const pts = '0,' + tipY + ' -' + baseW + ',' + baseY + ' ' + baseW + ',' + baseY;
  const arrowVis = bearing ? '' : 'display:none;';
  return (
    '<svg id="vm-' + vehicleId + '" width="36" height="36" viewBox="-18 -18 36 36"' +
    ' xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">' +
    '<g transform="rotate(' + ((Number.isFinite(bearing) ? bearing : 0) - mapBearing) + ')" style="' + arrowVis + '">' +
    // Arrow triangle (pointing up = direction of travel)
    '<polygon points="' + pts + '" fill="white" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>' +
    '</g>' +
    // Circle body (not rotated — label stays upright)
    '<circle cx="0" cy="0" r="' + r + '" fill="' + color + '" stroke="white" stroke-width="1.5"/>' +
    // Route label
    '<text x="0" y="0" text-anchor="middle" dominant-baseline="central"' +
    ' font-family="DM Mono,monospace" font-weight="700" font-size="' + fs + '" fill="white">' +
    routeId + '</text>' +
    '</svg>'
  );
}

// Calculate bearing between two GPS points (degrees, 0=N, 90=E)
function calcBearing(lat1, lng1, lat2, lng2) {
  const toRad = d => d * Math.PI / 180;
  const dLng = toRad(lng2 - lng1);
  const y = Math.sin(dLng) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// Approx distance in metres between two lat/lng (good enough at city scale)
function metresBetween(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const x = toRad(lng2 - lng1) * Math.cos(toRad((lat1 + lat2) / 2));
  const y = toRad(lat2 - lat1);
  return Math.sqrt(x*x + y*y) * R;
}

function applyMarkerRotation(iconEl, degrees) {
  // Rotate the inner tram-wrap, not the Leaflet positioning element
  const wrap = iconEl.querySelector('.tram-wrap');
  if (wrap) {
    wrap.style.transform = degrees ? 'rotate(' + degrees + 'deg)' : '';
  }
}
function initMap() {
  map = L.map('map', {
    center: [-37.814, 144.963],
    zoom: 13,
    zoomControl: true,
    attributionControl: true,
    rotate: true,          // leaflet-rotate: allow map bearing
    touchRotate: true,     // two-finger rotate on touch devices
    rotateControl: false,  // we use our own compass button
    bearing: 0,
  });

  // Tap-priority stacking (bottom to top): location dot < trams < stop dots.
  // Route lines stay in the default overlay pane (z 400); tram markers live in
  // Leaflet's marker pane (z 600). Stops render ABOVE trams so an arriving (or
  // mispositioned) tram can never block the tap target for stop arrivals.
  // leaflet-rotate splits the world in two: a CSS-rotated pane (tiles + vector
  // overlays) and an upright pane (markers, whose positions the plugin math-
  // rotates per element). Custom panes get neither treatment - they froze the
  // stop dots in unrotated coordinates whenever the map was rotated. So the
  // dots are plain divIcon markers in the standard marker pane instead, and
  // tap-priority stacking is done with zIndexOffset: location 0 < stops 50
  // < trams 100. Stops sat on top until the tab shape landed, because a tram
  // parked on a stop dot hid it completely; the tab's protruding end is always
  // clear of the track, so the tram can win the overlap again.

  // Street mode: dark CartoDB
  tileBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
  tileLabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
  }).addTo(map);

  // Apply saved map style (if not default dark)
  if (mapStyle !== 'dark') setMapStyle(mapStyle);

  // Free tram zone rectangle
  const ftz = L.rectangle(
    [[-37.8080, 144.9530], [-37.8230, 144.9760]],
    { color: '#4ade80', weight: 1.5, fillColor: '#4ade80', fillOpacity: 0.06, dashArray: '4 4' }
  ).addTo(map);
  ftz.bindTooltip('Free Tram Zone', { permanent: false, direction: 'center', className: 'ftz-tooltip' });

  // Compass / orient-north support (only if leaflet-rotate loaded)
  if (typeof map.setBearing === 'function') {
    map.on('rotate rotateend', updateCompass);
  } else {
    const cb = document.getElementById('compass-btn');
    if (cb) cb.style.display = 'none';
  }

  loadAndDrawRoutes();
}



// ── Geolocation ──────────────────────────────────────────────────────────────
let locationMarker = null, accuracyCircle = null;
let userLoc = null;   // {lat, lng} from the last geolocate fix

function locateMe(onFix) {
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation) {
    alert('Geolocation is not supported by your browser.');
    return;
  }
  btn.classList.add('locating');
  btn.classList.remove('located');

  navigator.geolocation.getCurrentPosition(
    pos => {
      wmtBeacon('geolocate');
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      // Remove previous markers
      if (locationMarker) map.removeLayer(locationMarker);
      if (accuracyCircle) map.removeLayer(accuracyCircle);

      // Accuracy circle
      accuracyCircle = L.circle([lat, lng], {
        interactive: false,   // big translucent disc must never eat stop/tram taps
        radius: acc,
        color: '#38bdf8', fillColor: '#38bdf8',
        fillOpacity: 0.1, weight: 1,
      }).addTo(map);

      // Blue dot marker. Plain marker so leaflet-rotate keeps it placed
      // correctly under rotation; default zIndexOffset 0 sits under trams.
      locationMarker = L.marker([lat, lng], {
        icon: L.divIcon({ className: 'loc-dot', iconSize: [18, 18] }),
      }).addTo(map).bindTooltip('You are here', { permanent: false });

      // Centre and zoom map
      map.setView([lat, lng], 16, { animate: true });

      btn.classList.remove('locating');
      btn.classList.add('located');
      userLoc = { lat, lng };
      if (typeof onFix === 'function') onFix();
    },
    err => {
      btn.classList.remove('locating');
      let msg = 'Could not get your location.';
      if (err.code === 1) msg = 'Location access denied. Please enable it in your browser settings.';
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// Show a transient centred notice; tapping anywhere dismisses it
function showNotice(msg) {
  const ov = document.getElementById('notice-overlay');
  document.getElementById('notice-card').textContent = msg;
  ov.classList.add('visible');
}

// "Nearby Stops": switch on only routes with a stop within NEARBY_RADIUS_M of
// the user's location. No fix yet → run the geolocate flow first, then filter.
// Nothing nearby → tell the user and restore all routes.

function nearbyStops() {
  if (!userLoc) { locateMe(nearbyStops); return; }
  if (!TRAM_NETWORK) return;
  // Radiating search: start at 350m, grow by 50m until >=2 routes appear,
  // capped at 3km (outer-suburb stops can be 600-800m from any point).
  const start = 350;
  let known = [];
  for (let radius = start; radius <= 3000; radius += 50) {
    const found = new Set();
    Object.values(TRAM_NETWORK.stops).forEach(s => {
      if (metresBetween(userLoc.lat, userLoc.lng, s.lat, s.lng) <= radius) {
        (s.r || []).forEach(r => found.add(r));
      }
    });
    known = [...found].filter(r => ROUTE_DEFS[r]);
    if (known.length >= 2) break;   // keep expanding until at least two routes appear
  }
  if (!known.length) {
    setAllRoutes(true);
    showNotice('Sorry, no trams are nearby');
    return;
  }
  setAllRoutes(false);
  known.forEach(r => { if (!activeRoutes.has(r)) toggleRoute(r); });
}

// A stop genuinely served by a route appears on 18-98% of its trips; across the
// whole network there is nothing between 3% and 18%. The stops below that cut are
// foreign — depot spurs (Southbank, Preston) and event workings to Docklands
// Stadium that wear a route number while running someone else's track. They drag
// whole corridors into the stop registry (route 86 picked up all of route 11's
// northern spine, 61 stops) AND they render as phantom dots, because a trip is
// interpolated along ITS OWN route's shape using distances that belong to a
// different path.
// Trimming the foreign stops out of each trip fixes both at once, and keeps the
// legitimate middle of a depot-out working instead of deleting the service. A
// trip left with under two stops was entirely foreign, so it goes.
const TRIP_MIN_SHARE = 0.05;   // safe band measured at 3%-18%; 5% has margin both ways

function trimForeignStops() {
  if (!SCHEDULE) return;
  let foreignStops = 0, tripsTrimmed = 0, tripsDropped = 0;
  const perRoute = {};
  Object.keys(SCHEDULE.trips).forEach(rid => {
    const trips = SCHEDULE.trips[rid];
    if (!trips || !trips.length) return;
    const cnt = {};
    trips.forEach(t => t.stops.forEach(s => { const k = String(s[0]); cnt[k] = (cnt[k] || 0) + 1; }));
    const foreign = new Set(Object.keys(cnt).filter(k => cnt[k] / trips.length < TRIP_MIN_SHARE));
    if (!foreign.size) return;
    foreignStops += foreign.size;
    let trimmed = 0, dropped = 0;
    const kept = [];
    trips.forEach(t => {
      if (!t.stops.some(s => foreign.has(String(s[0])))) { kept.push(t); return; }
      const s2 = t.stops.filter(s => !foreign.has(String(s[0])));
      if (s2.length < 2) { dropped++; return; }   // nothing legitimate left
      t.stops = s2; trimmed++; kept.push(t);
    });
    SCHEDULE.trips[rid] = kept;
    tripsTrimmed += trimmed; tripsDropped += dropped;
    perRoute[rid] = { foreign: foreign.size, trimmed: trimmed, dropped: dropped };
  });
  window.WMT_DEBUG.tripTrim = { foreignStops: foreignStops, tripsTrimmed: tripsTrimmed,
                                tripsDropped: tripsDropped, byRoute: perRoute };
}

// ── Schedule loading ─────────────────────────────────────────────────────────
async function loadSchedule() {
  const dayType = getTodayType();
  if (SCHEDULE_DAY === dayType && SCHEDULE) return; // already loaded

  SCHEDULE_DAY = dayType;
  SCHEDULE = { stops: {}, trips: {}, shapes: [] };

  const files = dayType === 'weekday'
    ? ['schedule_weekday_a1.json','schedule_weekday_a2.json','schedule_weekday_b.json','schedule_weekday_c.json']
    : dayType === 'saturday' ? ['schedule_saturday.json'] : ['schedule_sunday.json'];

  setStatus('loading', 'Loading timetable...');

  try {
    const results = await Promise.all(files.map(f => fetch(f).then(r => r.json())));
    results.forEach(data => {
      // Merge stops (same across all files)
      if (Object.keys(SCHEDULE.stops).length === 0) {
        SCHEDULE.stops = data.stops;
      }
      // Merge trips by route
      Object.entries(data.trips).forEach(([route, trips]) => {
        if (!SCHEDULE.trips[route]) SCHEDULE.trips[route] = [];
        SCHEDULE.trips[route].push(...trips);
      });
    });
    // Sort all trips by start time
    Object.values(SCHEDULE.trips).forEach(trips =>
      trips.sort((a, b) => a.start - b.start)
    );
    // Stamp routeId onto every trip (needed by tripKey everywhere, including
    // panels that touch trips the animation loop has never ticked)
    Object.entries(SCHEDULE.trips).forEach(([routeId, trips]) =>
      trips.forEach(t => { t.routeId = routeId; })
    );
   trimForeignStops();   // before the index: foreign stops must not reach matching or membership
    buildSchedIndex();
    // If live data arrived before the schedule finished loading, match it now
    if (LAST_LIVE_JSON) {
      const live = translateLiveDelays(LAST_LIVE_JSON);
      tripDelays = live.delays;
      tripStopDelays = live.stopDelays;
      FEED_TO_TRIP = live.feedToTrip || {};
      gpsDelaySensor(LAST_LIVE_JSON);
    }
    console.log('Schedule loaded:', Object.keys(SCHEDULE.trips).length, 'routes',
      Object.values(SCHEDULE.trips).reduce((s,t) => s+t.length, 0), 'trips');
    startScheduleAnimation();
  } catch(e) {
    console.warn('Could not load schedule:', e);
  }
}

// ── Schedule animation ────────────────────────────────────────────────────────
function startScheduleAnimation() {
  if (scheduleTimer) clearInterval(scheduleTimer);
  tickSchedule();
  scheduleTimer = setInterval(tickSchedule, 1000);
}

// ── Dot consolidation ───────────────────────────────────────────────────────
// Two scheduled trips can sit almost on top of each other (route 11 alone has
// ~24 near-duplicate pairs 60-120s apart; route 86 does it too). Two dots for
// what the rider experiences as one service is worse than one dot, so near
// neighbours on the same route AND the same direction collapse to one marker.
// Precedence inside a cluster: the tram the user currently has open (so a dot
// can never vanish while its panel is up), then a GPS-ringed tram (it carries
// real data), then lowest trip id — deterministic, so the survivor can never
// flicker between twins frame to frame.
// Distance is ALONG-ROUTE, not straight-line: same route+dir means the same
// shape, so the comparison is exact, and loops (35, the Docklands ends of
// 11/48/109) can't falsely merge trams sitting on opposite legs.
const MERGE_DIST_M = 175;   // along-route separation below which dots merge

function tramIsRinged(trip) {
  const m = TRAM_META[tripKey(trip)];
  return !!(m && m.pingAge !== undefined);
}

// Is `a` a better survivor than `b`?
function betterTram(a, b) {
  const aSel = selectedVehicle === 'sched_' + a.trip.id;
  const bSel = selectedVehicle === 'sched_' + b.trip.id;
  if (aSel !== bSel) return aSel;
  const aR = tramIsRinged(a.trip), bR = tramIsRinged(b.trip);
  if (aR !== bR) return aR;
  return String(a.trip.id) < String(b.trip.id);
}

function mergeNearbyTrams(placed) {
  const groups = {};
  const out = [];
  for (const it of placed) {
    // No shape distance (straight-line fallback) → never merge, always render
    if (typeof it.pos.dist !== 'number') { out.push(it); continue; }
    const k = it.routeId + '_' + it.trip.dir;
    (groups[k] = groups[k] || []).push(it);
  }
  let mergedAway = 0;
  for (const k in groups) {
    const list = groups[k].sort((a, b) => a.pos.dist - b.pos.dist);
    let i = 0;
    while (i < list.length) {
      // Cluster = everything within MERGE_DIST_M of this anchor. Anchored (not
      // chained) so a long line of evenly spaced trams can't collapse into one.
      let j = i + 1;
      while (j < list.length && list[j].pos.dist - list[i].pos.dist <= MERGE_DIST_M) j++;
      let best = list[i];
      for (let n = i + 1; n < j; n++) if (betterTram(list[n], best)) best = list[n];
      out.push(best);
      mergedAway += (j - i - 1);
      i = j;
    }
  }
  window.WMT_DEBUG.merge = { mergedAway: mergedAway, rendered: out.length,
                             thresholdM: MERGE_DIST_M, at: new Date().toLocaleTimeString() };
  return out;
}

function tickSchedule() {
  if (!SCHEDULE || !TRAM_NETWORK) return;

  // Handle midnight rollover: if seconds wrap, reload schedule
  const cs = nowSecs();
  // Keep compass + arrow compensation in sync with any map rotation
  if (typeof map.getBearing === 'function') { mapBearing = map.getBearing() || 0; }
  easeCorrections();   // dots chase the GPS target at 1 Hz, never in one hop
  // Flag stale data: positions keep animating but delays stop updating
  if (lastFetchOk && Date.now() - lastFetchOk > 60000) setStatus('stale', 'stale data');
  const active = getActiveTrips(cs);


  // ── Pass 1: place every active trip ──
  const placed = [];
  active.forEach(({ routeId, trip }) => {
    if (!activeRoutes.has(routeId)) return;
    const def = ROUTE_DEFS[routeId];
    if (!def) return;
    // Attach routeId to trip so interpolateTrip can look up shape
    trip.routeId = routeId;
    const pos = interpolateTrip(trip, SCHEDULE.stops, TRAM_NETWORK.routes, cs);
    if (!pos) return;
    placed.push({ routeId, trip, pos, def });
  });

  // ── Pass 2: merge near-duplicate dots, render only the survivors ──
  const seen = new Set();

  mergeNearbyTrams(placed).forEach(({ routeId, trip, pos, def }) => {
    // Use trip.id as the tram identifier for schedule trams
    const tramId = 'sched_' + trip.id;
    seen.add(tramId);
    watchJump(tramId, routeId, pos);

    const finalLat = pos.lat;
    const finalLng = pos.lng;
    const bearing  = pos.bearing;

    if (scheduleTrams[tramId]) {
      // Update existing marker
      try { scheduleTrams[tramId].marker.setLatLng([finalLat, finalLng]); } catch(e) {}
      // Update bearing
      const iconEl = scheduleTrams[tramId].marker._icon;
      if (iconEl) {
        const gEl = iconEl.querySelector('g');
        if (gEl) {
          gEl.setAttribute('transform', 'rotate(' + ((Number.isFinite(bearing) ? bearing : 0) - mapBearing) + ')');
          gEl.style.display = bearing ? '' : 'none';
        }
      }
      scheduleTrams[tramId].pos = pos;
      const sdata = scheduleTrams[tramId].data;   // keep panTo target current (was frozen at creation → map jumped to stale spot)
      if (sdata) { sdata.lat = finalLat; sdata.lng = finalLng; sdata.bearing = bearing; }
      const ic = scheduleTrams[tramId].marker._icon;
      if (ic) ic.classList.toggle('gps-broadcasting', !!TRAM_META[tripKey(trip)] && TRAM_META[tripKey(trip)].pingAge !== undefined);
    } else {
      // Create new marker
      const icon = L.divIcon({
        className: 'tram-icon-outer',
        html: makeTramSVG(routeId, def.color, bearing, tramId),
        iconSize: [36, 36],
        iconAnchor: [18, 18],
      });
      const marker = L.marker([finalLat, finalLng], { icon, zIndexOffset: 100 });
      marker.on('click', () => { wmtBeacon('tram_tap', routeId); showScheduleInfo(tramId); });
      marker.addTo(map);
      if (marker._icon && TRAM_META[tripKey(trip)] && TRAM_META[tripKey(trip)].pingAge !== undefined)
        marker._icon.classList.add('gps-broadcasting');
      scheduleTrams[tramId] = { marker, routeId, trip, pos,
        data: { routeId, vehicleLabel: trip.id, tripId: trip.id,
