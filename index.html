                lat: finalLat, lng: finalLng, bearing, speed: '—' }
      };
    }
  });

  // Remove trams no longer active
  Object.keys(scheduleTrams).forEach(id => {
    if (!seen.has(id)) {
      scheduleTrams[id].marker.remove();
      delete scheduleTrams[id];
    }
  });

  updateTramCount();

  // Live-refresh the stop arrivals panel so the minutes count down
  if (selectedStop !== null && cs - lastStopPanelRender >= 15) {
    showStopInfo(selectedStop);
  }
}



function showScheduleInfo(tramId) {
  const t = scheduleTrams[tramId];
  if (!t) return;
  const def = ROUTE_DEFS[t.routeId] || { color: '#888', name: 'Unknown' };
  const d = t.data;

  selectedVehicle = tramId;
  document.querySelectorAll('.tram-icon-outer svg').forEach(el => el.classList.remove('selected'));
  document.getElementById('vm-' + tramId)?.classList.add('selected');

  // Find next stop
  const cs = nowSecs();
  // Use the same per-stop effective times as positioning so the panel matches the map
  const effTimes = effectiveStopTimes(t.trip);
  const nextStopIdx = effTimes.findIndex(tt => tt > cs);
  let nextStopHtml = '';
  if (nextStopIdx >= 0) {
    const ns = t.trip.stops[nextStopIdx];
    // Use TRAM_NETWORK.stops for full stop names
    const stopFull = TRAM_NETWORK && TRAM_NETWORK.stops && TRAM_NETWORK.stops[String(ns[0])];
    const stopName = stopFull ? stopFull : { n: 'Stop ' + ns[0] };
    const arrSecs = effTimes[nextStopIdx];
    const minsAway = Math.round((arrSecs - cs) / 60);
    // Convert schedule seconds to HH:MM — schedule is in local Melbourne time
    const arrSecsLocal = arrSecs % 86400;
    const arrHH = Math.floor(arrSecsLocal / 3600) % 24;
    const arrMM = Math.floor((arrSecsLocal % 3600) / 60);
    const arrStr = String(arrHH).padStart(2,'0') + ':' + String(arrMM).padStart(2,'0');
    nextStopHtml = stopName
      ? '<div class="info-row"><span class="info-label">Next stop</span><span class="info-value" style="font-size:11px">' +
        stopName.n + '</span></div>' +
        '<div class="info-row"><span class="info-label">Arrives</span><span class="info-value" id="wmt-arrives" style="font-family:var(--font-mono)">' +
        arrStr + ' (' + (minsAway <= 0 ? 'now' : minsAway + ' min') + ')</span></div>'
      : '';
  }

  const nameParts = def.name.split(' – ');  // split on em dash
  const dirLabel = t.trip.dir === 1
    ? '→ ' + (nameParts[1] || def.name)
    : '← ' + (nameParts[0] || def.name);

  document.getElementById('info-content').innerHTML =
    '<div style="display:flex;align-items:center;margin-bottom:12px;">' +
    '<span class="info-route-badge" style="background:' + def.color + '">' + t.routeId + '</span>' +
    '<span style="font-size:13px;font-weight:600;">' + def.name + '</span></div>' +
    (function() {
      const m = TRAM_META[tripKey(t.trip)];
      const txt = (m && m.model)
        ? 'Tram model ' + m.model + (TRAM_ACCESS[m.model] ? ' \u2013 ' + TRAM_ACCESS[m.model] : '')
        : 'Tram model not available';
      return '<div id="wmt-model" style="font-size:13px;color:#fff;margin-bottom:12px;">' + txt + '</div>';
    })() +
    '<div class="info-row"><span class="info-label">Direction</span><span class="info-value">' + dirLabel + '</span></div>' +
    nextStopHtml +
'<div class="info-row"><span class="info-label">Source</span><span class="info-value" id="wmt-source" style="font-family:var(--font-mono);font-size:11px;">' + ((TRAM_META[tripKey(t.trip)] && TRAM_META[tripKey(t.trip)].pingAge !== undefined) ? 'GPS Corrected' : 'Timetable') + '</span></div>' +    (function() {
      const tk = tripKey(t.trip);
      const hasData = (tripStopDelays[tk] && tripStopDelays[tk].length) || tripDelays[tk] !== undefined;
      // Always render the row: with no DL there is still a slot for PTV to fill.
      if (!hasData) return '<div class="info-row"><span class="info-label">Running</span>' +
        '<span class="info-value" id="wmt-running" style="color:#64748b">\u2014</span></div>';
      // Delay at the next stop specifically (varies along the route)
      const ds = nextStopIdx >= 0
        ? effTimes[nextStopIdx] - (t.trip.start + t.trip.stops[nextStopIdx][1])
        : (tripDelays[tk] || 0);
      const mins = Math.round(ds / 60);
      const label = mins > 2 ? mins + ' min late' : mins < -1 ? Math.abs(mins) + ' min early' : 'On time';
      const color = mins > 2 ? '#f87171' : mins < -1 ? '#34d399' : '#94a3b8';
      return '<div class="info-row"><span class="info-label">Running</span><span class="info-value" id="wmt-running" style="color:' + color + ';font-weight:600">' + label + '</span></div>';
    })();

  document.getElementById('info-panel').classList.add('visible');
  if (Number.isFinite(d.lat) && Number.isFinite(d.lng)) map.panTo([d.lat, d.lng], { animate: true });
  if (PTV_FIELD) ptvApply(tramId, t.trip, nextStopIdx);
}

// ── Load network data then draw ──────────────────────────────────────────────
async function loadAndDrawRoutes() {
  try {
    const res = await fetch('tram_network.json');
    TRAM_NETWORK = await res.json();
    drawRouteLines();
    drawStopDots();
    // Load schedule after network is ready
    await loadSchedule();
    mergeScheduleRouteMembership();   // registry r arrays are sparse; schedule is truth
    snapStopsToShapes();              // then sit every dot on its route's drawn line
  } catch(e) {
    console.warn('Could not load tram_network.json:', e);
  }
}

function drawRouteLines() {
  if (!TRAM_NETWORK) return;
  // New network format: routes[id] = { "0": [[lat,lng,dist],...], "1": [...] }
  Object.entries(TRAM_NETWORK.routes).forEach(([id, dirs]) => {
    const def = ROUTE_DEFS[id];
    if (!def) return;

    const active = activeRoutes.has(id);
    const lines = [], casings = [];

    // Draw both directions as separate polylines
    Object.entries(dirs).forEach(([dir, pts]) => {
      const latLngs = pts.map(p => [p[0], p[1]]);
      if (latLngs.length === 0) return;

      const casing = L.polyline(latLngs, {
        color: '#fff', weight: 8, opacity: 0.3,
        lineJoin: 'round', lineCap: 'round',
      });
      const line = L.polyline(latLngs, {
        color: def.color, weight: 4, opacity: 1,
        lineJoin: 'round', lineCap: 'round',
      });
      line.bindTooltip('Route ' + id + ' — ' + def.name, { sticky: true });

      if (active) { casing.addTo(map); line.addTo(map); }
      lines.push(line); casings.push(casing);
    });

    routeLayers[id] = { lines, casings, dots: [] };
  });
}

// Stop markers keyed by stop ID for per-route visibility
let stopMarkers = {}; // stopId -> { marker, routes[] }

// Shared divIcon for every stop dot (16px = the old circleMarker radius 8)
const STOP_DOT_ICON = L.divIcon({ className: 'stop-dot', iconSize: [16, 16] });

// 36 shared tab icons, one per 10 degrees (worst case 5 degrees of error, under
// 2px of drift at a 22px reach — invisible). Baking the angle into the icon
// rather than the element matters: updateStopVisibility removes and re-adds
// markers on every route toggle and Leaflet rebuilds the DOM node each time,
// which would wipe an inline style. Unrotated a tab points WEST, which is also
// the fallback when the side of the road cannot be determined.
const STOP_TAB_ICONS = (() => {
  const rules = [], icons = [];
  for (let b = 0; b < 36; b++) {
    rules.push('.stop-tab.r' + b + '{--r:' + (b * 10) + '}');
    icons.push(L.divIcon({ className: 'stop-tab r' + b, html: '<i></i>',
                           iconSize: [38, 16], iconAnchor: [38, 8] }));
  }
 const st = document.createElement('style');
  st.textContent = rules.join('');
  document.head.appendChild(st);
  return icons;
})();

// Parallel red set, used only in audit mode to mark suspect stops.
const STOP_TAB_ICONS_ROGUE = (() => {
  const icons = [];
  for (let b = 0; b < 36; b++)
    icons.push(L.divIcon({ className: 'stop-tab rogue r' + b, html: '<i></i>',
                           iconSize: [38, 16], iconAnchor: [38, 8] }));
  return icons;
})();

function drawStopDots() {
  if (!TRAM_NETWORK) return;
  // New format: stops is object {stop_id: {n, lat, lng, r:[routes]}}
  Object.entries(TRAM_NETWORK.stops).forEach(([sid, stop]) => {
    const routes = stop.r || [];
    const marker = L.marker([stop.lat, stop.lng], {
      icon: STOP_TAB_ICONS[0],   // west by default; orientStopTabs refines it
      zIndexOffset: 50,   // below tram markers (100). Tabs extend clear of the track,
                          // so a tram over the stop no longer blocks its tap target —
                          // the old stops-on-top rule existed only for that overlap.
    }).bindTooltip(stop.n, { sticky: true, direction: 'top' });
    marker.on('click', () => {
      if (AUDIT_DEBUG) { auditOpen(sid); return; }   // dev: diagnose route membership
      if (TAB_DEBUG) { tabEditOpen(sid); return; }   // dev: rotate, don't show arrivals
      wmtBeacon('stop_tap', sid); showStopInfo(sid);
    });
    if (routes.some(r => activeRoutes.has(r))) {
      marker.addTo(map);
    }
    stopMarkers[sid] = { marker, routes };
  });
}

function updateStopVisibility() {
  Object.values(stopMarkers).forEach(({ marker, routes }) => {
    const shouldShow = routes.some(r => activeRoutes.has(r));
    if (shouldShow) marker.addTo(map);
    else map.removeLayer(marker);
  });
}

// Heal sparse route membership in the stop registry. The generated r arrays
// under-list routes (route 86 lists 28 of its 201 stops; route 19, 12 of 68),
// which blanked stop dots and arrivals routes along single-route corridors.
// Schedule trips are ground truth for which routes serve which stops: union
// them in, re-point the drawn markers, and re-apply visibility.
function mergeScheduleRouteMembership() {
  if (!SCHEDULE || !TRAM_NETWORK) return;
  Object.entries(SCHEDULE.trips).forEach(([routeId, trips]) => {
    const served = new Set();
    trips.forEach(t => t.stops.forEach(s => served.add(String(s[0]))));
    served.forEach(sid => {
      const stop = TRAM_NETWORK.stops[sid];
      if (!stop) return;
      if (!stop.r) stop.r = [];
      if (!stop.r.includes(routeId)) stop.r.push(routeId);
    });
  });
  Object.entries(stopMarkers).forEach(([sid, entry]) => {
    const stop = TRAM_NETWORK.stops[sid];
    if (stop && stop.r) entry.routes = stop.r;
  });
  applyStopExclusions();   // strike out route memberships known to be wrong
  updateStopVisibility();
}
// Snap stop dots onto the drawn route line. Registry coordinates are physical
// platform positions, often offset 10-30m from the track centreline (median
// reservations especially), which left dots floating beside the route. Display
// only: markers move, registry lat/lng stay pristine for all distance logic.
// Directional platform pairs will now overlap on the line; the stop panel
// already shows both directions, so nothing is lost.
function snapStopsToShapes() {
  if (!TRAM_NETWORK) return;
  const geo = {};   // sid -> {lat,lng,bearing} for the tab-orientation pass
  Object.entries(stopMarkers).forEach(([sid, entry]) => {
    const stop = TRAM_NETWORK.stops[sid];
    if (!stop || !stop.r || !stop.r.length) return;
    let best = null;
    stop.r.forEach(routeId => {
      const dirs = TRAM_NETWORK.routes[routeId];
      if (!dirs) return;
      Object.values(dirs).forEach(shape => {
        if (!Array.isArray(shape) || shape.length < 2 || !Array.isArray(shape[0])) return;
        const proj = projectOnShape(shape, stop.lat, stop.lng);
        if (proj && (!best || proj.off < best.off)) best = { off: proj.off, shape: shape, dist: proj.dist };
      });
    });
    if (best && best.off <= 100) {   // sanity gate: never snap across a suburb
      const p = posOnShape(best.shape, best.dist);
      if (p) {
        entry.marker.setLatLng([p.lat, p.lng]);
        // Keep the RAW registry position and the perpendicular offset. The marker
        // moves onto the track, but the untouched platform coordinate is what
        // says which side of the road the platform is physically on — snapping
        // flattens that away, which is why pairing on snapped coords misfired.
        geo[sid] = { lat: p.lat, lng: p.lng, bearing: p.bearing,
                     rawLat: stop.lat, rawLng: stop.lng, off: best.off };
      }
    }
  });
orientStopTabs(geo);
  markRogueTabs();   // audit mode only: paint the suspects red
}

// Point each stop tab at the side of the road its platform is on.
// The tab extends 90 degrees off the track; which of the two perpendicular
// directions is right comes from the platform PAIR. Melbourne stops are
// direction-specific, the two platforms straddle the road (usually staggered a
// little along it), and they share an identical name — so each tab simply points
// AWAY from its partner. That is robust in a way left-of-travel alone is not: on
// a centre-road reservation the two direction shapes almost coincide, so the
// nearest-shape bearing can come back 180 degrees out, and flipping the bearing
// also flips which side the partner appears on, giving the same final answer.
// No partner, three or more sharing a name, or the two sitting in line along the
// road (no cross-road offset to read) -> point west. Both directions are listed
// in the stop panel regardless, so little is lost.
const TAB_PAIR_MAX_M = 80;    // a partner further away is a different stop
const TAB_MIN_OFFSET_M = 4;   // below this the cross-road offset is just noise

// Melbourne names each platform after ITS OWN nearest cross-street, so the two
// sides of one stop routinely carry DIFFERENT names — "Moubray St/St Kilda Rd #26"
// and "Beatrice St/St Kilda Rd #26" are the same stop — and some pairs simply
// swap the street order ("Montague St/Bridport St #28" / "Bridport St/Montague
// St #28"). Neither survives an exact-name match, which is why whole median
// reservation corridors (St Kilda Rd, Dandenong Rd, Nicholson St) fell through
// to the west fallback. The stop NUMBER is the stable part of the name, so group
// on that and let proximity separate the unrelated stops elsewhere on the
// network that happen to share a number.
function tabPairKey(stop) {
  const n = stop && stop.n ? String(stop.n).trim() : '';
  const m = n.match(/#(\S+)\s*$/);
  return m ? '#' + m[1] : n;        // unnumbered stop: fall back to the whole name
}

// The single member of this group within TAB_PAIR_MAX_M. Stop numbers repeat
// across the network (#34 exists on Dandenong Rd and on Ascot Vale Rd), so
// proximity does the disambiguating. Two or more candidates in range is
// ambiguous — return nothing rather than guess.
function tabFindPartner(sid, me, grp, geo) {
  if (!grp) return null;
  const mLat = 111320, mLng = 111320 * Math.cos(me.rawLat * Math.PI / 180);
  let found = null, n = 0;
  for (const o of grp) {
    if (o === sid) continue;
    const g = geo[o];
    if (!g) continue;
    const dx = (g.rawLng - me.rawLng) * mLng, dy = (g.rawLat - me.rawLat) * mLat;
    if (Math.sqrt(dx * dx + dy * dy) <= TAB_PAIR_MAX_M) { found = o; n++; }
  }
  return n === 1 ? found : null;
}
// ── Rogue stop audit (dev only, ?audit=1) ───────────────────────────────────
// Some stops carry a route that does not actually serve them, which puts a tab
// on the wrong street AND lists phantom arrivals for that route in the stop
// panel. The giveaway is geometric: a stop a route really serves sits within a
// few tens of metres of that route's own shape, so a 400 m offset is a
// misassignment. Click any stop in audit mode to see its per-route offsets and
// strike out the wrong ones. Exclusions are (stop, route) pairs — the stop stays
// live for the routes that genuinely serve it — with '*' to drop a stop outright
// when its coordinates are simply wrong.
const AUDIT_DEBUG = (() => { try { return new URLSearchParams(location.search).get('audit') === '1'; } catch (e) { return false; } })();
const AUDIT_LIMIT_M = 150;   // beyond this, a route almost certainly does not serve the stop

const STOP_EXCLUDE_BAKED = {
  // Registry-native strays: tram_network.json lists route 12 on these two
  // Southbank depot-spur platforms, so trimForeignStops cannot reach them
  // (it only filters what the schedule contributes). Their partner platforms
  // 19304 and 19721 are clean, which is what makes this look like source noise
  // rather than a pattern.
  '18184': ['12'],   // Clarendon St/Whiteman St #125 — 12 @ 80m
  '19369': ['12'],   // Southbank Tram Depot/Light Rail #125A — 12 @ 331m
};
let STOP_EXCLUDE = Object.assign({}, STOP_EXCLUDE_BAKED);
try { Object.assign(STOP_EXCLUDE, JSON.parse(localStorage.getItem('wmt_stop_exclude') || '{}')); } catch (e) {}
let STOP_ROUTES_RAW = {};    // sid -> route list before exclusions (so they can be undone)
let auditSid = null;

// Smallest distance from a point to any direction-shape of this route.
function routeOffset(rid, lat, lng) {
  const dirs = TRAM_NETWORK.routes[rid];
  if (!dirs) return null;
  let best = Infinity;
  Object.values(dirs).forEach(shape => {
    if (!Array.isArray(shape) || shape.length < 2 || !Array.isArray(shape[0])) return;
    const p = projectOnShape(shape, lat, lng);
    if (p && p.off < best) best = p.off;
  });
  return best === Infinity ? null : best;
}

// Every route this stop claims, with how far the stop sits from that route's
// line — sorted worst first, so a misassignment is the top row.
function auditRows(sid) {
  const s = TRAM_NETWORK.stops[sid];
  if (!s) return [];
  return (STOP_ROUTES_RAW[sid] || s.r || []).map(rid => ({
    rid: rid, off: routeOffset(rid, s.lat, s.lng)
  })).sort((a, b) => (b.off === null ? -1 : b.off) - (a.off === null ? -1 : a.off));
}

// Rebuild every stop's route list from the untouched original, minus exclusions.
// Re-runnable: always starts from RAW, so unticking a route restores it.
function applyStopExclusions() {
  if (!TRAM_NETWORK) return;
  let cut = 0, dropped = 0;
  Object.keys(TRAM_NETWORK.stops).forEach(sid => {
    const stop = TRAM_NETWORK.stops[sid];
    if (STOP_ROUTES_RAW[sid] === undefined) STOP_ROUTES_RAW[sid] = (stop.r || []).slice();
    const ex = STOP_EXCLUDE[sid];
    let r = STOP_ROUTES_RAW[sid];
    if (ex === '*') { r = []; dropped++; }
    else if (Array.isArray(ex) && ex.length) { r = r.filter(x => ex.indexOf(x) === -1); cut += ex.length; }
    stop.r = r;
    if (stopMarkers[sid]) stopMarkers[sid].routes = r;
  });
  window.WMT_DEBUG.stopExclude = { stops: Object.keys(STOP_EXCLUDE).length,
                                   pairsCut: cut, stopsDropped: dropped };
}

// Paint every visible stop red whose worst active-route offset exceeds the limit,
// so the suspects can be spotted rather than hunted.
function markRogueTabs() {
  if (!AUDIT_DEBUG) return;
  let flagged = 0;
  Object.keys(stopMarkers).forEach(sid => {
    const s = TRAM_NETWORK.stops[sid];
    if (!s || !s.r || !s.r.length) return;
    let worst = 0;
    s.r.forEach(rid => {
      if (!activeRoutes.has(rid)) return;
      const o = routeOffset(rid, s.lat, s.lng);
      if (o !== null && o > worst) worst = o;
    });
    if (worst <= AUDIT_LIMIT_M) return;
    const b10 = Math.round((window.WMT_DEBUG.stopTabs &&
                window.WMT_DEBUG.stopTabs.rot[sid] || 0) / 10) % 36;
    stopMarkers[sid].marker.setIcon(STOP_TAB_ICONS_ROGUE[b10]);
    flagged++;
  });
  window.WMT_DEBUG.rogue = { flagged: flagged, limitM: AUDIT_LIMIT_M };
}

function auditPersist() {
  try { localStorage.setItem('wmt_stop_exclude', JSON.stringify(STOP_EXCLUDE)); } catch (e) {}
  window.WMT_DEBUG.stopExcludeList = STOP_EXCLUDE;
}

function auditOpen(sid) {
  auditSid = String(sid);

  if (!box) {

    box.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);' +
      'background:var(--surface);border:1px solid var(--border);border-radius:12px;' +
      'padding:12px 16px;z-index:3000;font-family:var(--font-ui);font-size:13px;' +
      'color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,0.6);min-width:320px;max-width:90vw;';
    document.body.appendChild(box);
  }
  box.style.display = 'block';
  auditRender();
}

function auditRender() {
  const box = document.getElementById('audit-box');
  if (!box) return;
  const s = TRAM_NETWORK.stops[auditSid] || {};
  const ex = STOP_EXCLUDE[auditSid];
  const dropped = ex === '*';
  const rows = auditRows(auditSid).map(r => {
    const off = r.off === null ? '?' : Math.round(r.off) + 'm';
    const bad = r.off !== null && r.off > AUDIT_LIMIT_M;
    const gone = dropped || (Array.isArray(ex) && ex.indexOf(r.rid) !== -1);
    const col = bad ? '#f87171' : (r.off !== null && r.off > 50 ? '#fbbf24' : '#34d399');
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;' +
      (gone ? 'opacity:0.45;text-decoration:line-through;' : '') + '">' +
      '<span class="info-route-badge" style="background:' +
        ((ROUTE_DEFS[r.rid] || {}).color || '#888') + ';margin:0;">' + r.rid + '</span>' +
      '<span style="flex:1;font-family:var(--font-mono);font-size:12px;color:' + col + '">' + off + '</span>' +
      '<button onclick="auditToggle(\'' + r.rid + '\')" style="' + TAB_BTN + '">' +
        (gone ? 'Restore' : 'Remove') + '</button></div>';
  }).join('');
  const n = Object.keys(STOP_EXCLUDE).length;
  box.innerHTML =
    '<div style="font-weight:600;margin-bottom:2px;">' + (s.n || auditSid) + '</div>' +
    '<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:10px;">' +
      'id ' + auditSid + ' \u00b7 distance from each route\u2019s line</div>' +
    rows +
    '<div style="display:flex;gap:6px;margin-top:10px;">' +
      '<button onclick="auditDropAll()" style="' + TAB_BTN + ';flex:1' +
        (dropped ? ';background:#f87171;color:#000;border-color:#f87171' : '') + '">' +
        (dropped ? 'Undrop stop' : 'Drop stop') + '</button>' +
      '<button onclick="auditClose()" style="' + TAB_BTN + ';flex:1">Close</button>' +
      '<button onclick="auditCopy()" style="' + TAB_BTN + '" title="Copy all exclusions">Copy ' + n + '</button>' +
    '</div>';
}

function auditToggle(rid) {
  if (!auditSid) return;
  if (STOP_EXCLUDE[auditSid] === '*') return;          // drop-all wins; undrop first
  const cur = Array.isArray(STOP_EXCLUDE[auditSid]) ? STOP_EXCLUDE[auditSid].slice() : [];
  const i = cur.indexOf(rid);
  if (i === -1) cur.push(rid); else cur.splice(i, 1);
  if (cur.length) STOP_EXCLUDE[auditSid] = cur; else delete STOP_EXCLUDE[auditSid];
  auditPersist();
  applyStopExclusions();
  updateStopVisibility();
  auditRender();
}

function auditDropAll() {
  if (!auditSid) return;
  if (STOP_EXCLUDE[auditSid] === '*') delete STOP_EXCLUDE[auditSid];
  else STOP_EXCLUDE[auditSid] = '*';
  auditPersist();
  applyStopExclusions();
  updateStopVisibility();
  auditRender();
}

function auditClose() {
  auditSid = null;
  const box = document.getElementById('audit-box');
  if (box) box.style.display = 'none';
}

function auditCopy() {
  const ids = Object.keys(STOP_EXCLUDE).sort();
  const lines = ids.map(sid => {
    const s = TRAM_NETWORK.stops[sid] || {};
    const ex = STOP_EXCLUDE[sid];
    if (ex === '*') return "  '" + sid + "': '*',   // " + (s.n || '') + ' \u2014 dropped';
    const why = ex.map(rid => {
      const o = routeOffset(rid, s.lat, s.lng);
      return rid + ' @ ' + (o === null ? '?' : Math.round(o)) + 'm';
    }).join(', ');
    return "  '" + sid + "': ['" + ex.join("','") + "'],   // " + (s.n || '') + ' \u2014 ' + why;
  });
  const txt = '// ' + ids.length + ' stop-route exclusions, ' +
              new Date().toISOString().slice(0, 10) + '\nconst STOP_EXCLUDE_FIXED = {\n' +
              lines.join('\n') + '\n};';
  navigator.clipboard.writeText(txt).then(
    () => showNotice(ids.length + ' exclusion' + (ids.length === 1 ? '' : 's') + ' copied'),
    () => { console.log(txt); showNotice('Clipboard blocked \u2014 logged to console'); }
  );
}

function tabEditNudge(d) {
  if (!tabEditSid) return;
  tabEditDeg = ((tabEditDeg + d) % 360 + 360) % 360;
  tabSetIcon(tabEditSid, tabEditDeg);
  tabEditRender();
}

function tabEditReset() {
  if (!tabEditSid) return;
  delete TAB_TWEAK[tabEditSid];
  tabTweakPersist();
  tabEditDeg = TAB_COMPUTED[tabEditSid] || 0;
  tabSetIcon(tabEditSid, tabEditDeg);
  tabEditRender();
}

function tabEditSave() {
  if (!tabEditSid) return;
  // Matching the algorithm again means there is nothing to override.
  if (tabEditDeg === TAB_COMPUTED[tabEditSid]) delete TAB_TWEAK[tabEditSid];
  else TAB_TWEAK[tabEditSid] = tabEditDeg;
  tabTweakPersist();
  tabEditClose();
}

function tabEditClose() {
  if (tabEditSid) {
    const keep = (TAB_TWEAK[tabEditSid] !== undefined) ? TAB_TWEAK[tabEditSid]
               : (TAB_COMPUTED[tabEditSid] || 0);
    tabSetIcon(tabEditSid, keep);          // discard any unsaved nudging
  }
  tabEditSid = null;
  const box = document.getElementById('tab-edit');
  if (box) box.style.display = 'none';
}

function tabEditCopy() {
  const ids = Object.keys(TAB_TWEAK).sort();
  const lines = ids.map(sid => {
    const st = TRAM_NETWORK.stops[sid] || {};
    const comp = TAB_COMPUTED[sid];
    let note = st.n || '';
    if (comp !== undefined) {
      const d = ((TAB_TWEAK[sid] - comp) % 360 + 360) % 360;
      const how = (d === 180) ? 'flip' : ((d > 180 ? d - 360 : '+' + d) + '\u00b0');
      note += ' \u2014 was ' + comp + '\u00b0 (' + how + ')';
    }
    return "  '" + sid + "': " + TAB_TWEAK[sid] + ',   // ' + note;
  });
  const txt = '// ' + ids.length + ' hand-tuned stop tab angles, ' +
              new Date().toISOString().slice(0, 10) + '\nconst TAB_TWEAK_FIXED = {\n' +
              lines.join('\n') + '\n};';
  navigator.clipboard.writeText(txt).then(
    () => showNotice(ids.length + ' override' + (ids.length === 1 ? '' : 's') + ' copied'),
    () => { console.log(txt); showNotice('Clipboard blocked \u2014 logged to console'); }
  );
}

function orientStopTabs(geo) {
  // Group by stop number, then resolve each stop's partner by proximity.
  const byKey = {};
  Object.keys(geo).forEach(sid => {
    const k = tabPairKey(TRAM_NETWORK.stops[sid]);
    if (k) (byKey[k] = byKey[k] || []).push(sid);
  });
  const partner = {};
  Object.keys(geo).forEach(sid => {
    const p = tabFindPartner(sid, geo[sid],
                             byKey[tabPairKey(TRAM_NETWORK.stops[sid])], geo);
    if (p) partner[sid] = p;
  });

  const rot = {}, srcOf = {};
  let byOffset = 0, byPair = 0, byPartner = 0, fallback = 0;

  // Pass 1 — the platform's own recorded offset from the track (the marker sits
  // on the track, the registry coordinate sits where the platform physically is,
  // so the tab just points from one to the other), else which side of the road
  // its partner sits on.
  Object.keys(geo).forEach(sid => {
    const me = geo[sid];
    if (me.off >= TAB_MIN_OFFSET_M) {
      rot[sid] = calcBearing(me.lat, me.lng, me.rawLat, me.rawLng) - 270;
      srcOf[sid] = 'offset'; byOffset++;
      return;
    }
    const other = partner[sid] ? geo[partner[sid]] : null;
    if (!other) return;
    const mLat = 111320, mLng = 111320 * Math.cos(me.rawLat * Math.PI / 180);
    const dx = (other.rawLng - me.rawLng) * mLng;   // east
    const dy = (other.rawLat - me.rawLat) * mLat;   // north
    const b = (me.bearing || 0) * Math.PI / 180;
    const lx = -Math.cos(b), ly = Math.sin(b);      // unit vector 90 deg LEFT of travel
    const side = dx * lx + dy * ly;                 // >0 : partner is on my left
    if (Math.abs(side) >= TAB_MIN_OFFSET_M) {
      rot[sid] = (side > 0) ? (me.bearing - 180) : me.bearing;
      srcOf[sid] = 'pair'; byPair++;
    }
  });

  // Pass 2 — the two platforms of a stop always face opposite ways, so a solved
  // side solves its partner. Rescues pairs where only one had a usable offset.
  Object.keys(geo).forEach(sid => {
    if (rot[sid] !== undefined) return;
    const op = partner[sid];
    if (op === undefined || rot[op] === undefined) return;
    rot[sid] = rot[op] + 180;
    srcOf[sid] = 'partner'; byPartner++;
  });

  // Pass 3 — render, applying manual flips and hand-tuned angles last.
  const rotMap = {};
  Object.keys(geo).forEach(sid => {
    let r = rot[sid], src = srcOf[sid] || 'west';
    if (r === undefined) { r = 0; fallback++; }
    if (TAB_FLIP.has(String(sid))) r += 180;
    let b10 = ((Math.round(r / 10) % 36) + 36) % 36;
    TAB_COMPUTED[String(sid)] = b10 * 10;                  // what the algorithm chose
    if (TAB_TWEAK[String(sid)] !== undefined) {            // hand-tuned angle wins
      b10 = ((Math.round(TAB_TWEAK[String(sid)] / 10) % 36) + 36) % 36;
      src = 'tweak';
    }
    rotMap[sid] = b10 * 10;
    stopMarkers[sid].marker.setIcon(STOP_TAB_ICONS[b10]);
    if (TAB_DEBUG) {
      const st2 = TRAM_NETWORK.stops[sid];
      stopMarkers[sid].marker.setTooltipContent(
        (st2 && st2.n ? st2.n : sid) + ' \u00b7 id ' + sid + ' \u00b7 ' + (b10 * 10) +
        '\u00b0 \u00b7 ' + src + ' \u00b7 off ' +
        (geo[sid].off === undefined ? '?' : Math.round(geo[sid].off)) + 'm');
    }
  });
  window.WMT_DEBUG.stopTabs = { oriented: Object.keys(geo).length, byOffset: byOffset,
    byPair: byPair, byPartner: byPartner, westFallback: fallback, rot: rotMap };
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('route-list');
  const pills = document.getElementById('mobile-pills');
  list.innerHTML = ''; pills.innerHTML = '';

  GROUPS.forEach(group => {
    const routes = Object.entries(ROUTE_DEFS).filter(([,d]) => d.group === group);
    if (!routes.length) return;

    const header = document.createElement('div');
    header.className = 'route-group-header';
    header.textContent = group;
    list.appendChild(header);

    routes.forEach(([id, def]) => {
      const item = document.createElement('div');
      item.className = 'route-item' + (activeRoutes.has(id) ? '' : ' dimmed');
      item.id = 'route-item-' + id;
      item.style.setProperty('--color', def.color);
      item.innerHTML = `
        <div class="route-toggle" title="Toggle route ${id}"></div>
        <div class="route-num" style="background:${def.color}">${id}</div>
        <div class="route-name">${def.name}</div>
        <div class="route-tram-count" id="rc-${id}">0</div>
      `;
      item.addEventListener('click', () => { if (!activeRoutes.has(id)) wmtBeacon('route_toggle', id); toggleRoute(id); });
      list.appendChild(item);

      // Mobile pill
      const pill = document.createElement('div');
      pill.className = 'mobile-pill' + (activeRoutes.has(id) ? '' : ' dimmed');
      pill.id = 'pill-' + id;
      pill.style.background = def.color;
      pill.textContent = id;
      pill.addEventListener('click', () => { if (!activeRoutes.has(id)) wmtBeacon('route_toggle', id); toggleRoute(id); });
      pills.appendChild(pill);
    });
  });
}

function setAllRoutes(on) {
  Object.keys(ROUTE_DEFS).forEach(id => {
    if (on !== activeRoutes.has(id)) toggleRoute(id);
  });
  saveRoutes();
}

function toggleRoute(id) {
  if (activeRoutes.has(id)) activeRoutes.delete(id);
  else activeRoutes.add(id);
  saveRoutes();

  const on = activeRoutes.has(id);
  document.getElementById('route-item-' + id)?.classList.toggle('dimmed', !on);
  document.getElementById('pill-' + id)?.classList.toggle('dimmed', !on);

  // Show/hide schedule tram markers for this route
  Object.values(scheduleTrams).forEach(t => {
    if (t.routeId === id) {
      if (on) t.marker.addTo(map);
      else t.marker.remove();
    }
  });

  // Show/hide route lines + stop dots
  if (routeLayers[id]) {
    const { lines, casings, dots } = routeLayers[id];
    if (on) {
      casings.forEach(c => c.addTo(map));
      lines.forEach(l => l.addTo(map));
      dots.forEach(d => d.addTo(map));
    } else {
      casings.forEach(c => map.removeLayer(c));
      lines.forEach(l => map.removeLayer(l));
      dots.forEach(d => map.removeLayer(d));
    }
  }

  updateTramCount();
  updateStopVisibility();

}

// ── Fetch trams from Worker ────────────────────────────────────────────────

async function fetchTrams() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻ Loading…';
  btn.style.opacity = '0.6';

  try {
    const r = await fetch(WORKER_URL);
    if (!r.ok) throw new Error('Worker returned HTTP ' + r.status);
    const json = await r.json();
    if (json.error) throw new Error(json.error);
    const vehicles = json.vehicles || [];

    // Store trip delays from Trip Updates feed
    LAST_LIVE_JSON = json;
    const live = translateLiveDelays(json);
    tripDelays = live.delays;
    tripStopDelays = live.stopDelays;
    FEED_TO_TRIP = live.feedToTrip || {};
    gpsDelaySensor(json);
    lastFetchOk = Date.now();
    // Store service alerts (present once the Worker exposes them)
    serviceAlerts = json.alerts || [];
    renderAlerts();
    processVehicles(vehicles);
    setStatus('live', 'live');
    document.getElementById('error-banner').style.display = 'none';

    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Updated ' + now.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

  } catch (err) {
    console.error('Fetch error:', err);
    setStatus('error', 'Connection error');
    const eb = document.getElementById('error-banner');
    eb.style.display = 'block';
    eb.textContent = `⚠ Could not fetch live data: ${err.message}. Retrying in 60s…`;
  } finally {
    btn.textContent = '↻ Refresh';
    btn.style.opacity = '1';
  }
}

function processVehicles(vehicles) {
  // Update the vehicle count display
  const counts = {};
  Object.values(scheduleTrams).forEach(t => {
    counts[t.routeId] = (counts[t.routeId] || 0) + 1;
  });
  Object.keys(ROUTE_DEFS).forEach(id => {
    const el = document.getElementById('rc-' + id);
    if (el) el.textContent = counts[id] || 0;
  });
  updateTramCount();
}

function updateTramCount() {
  const visible = Object.values(scheduleTrams).filter(t => activeRoutes.has(t.routeId)).length;
  document.getElementById('tram-count-badge').textContent = visible + ' trams';
  document.getElementById('mobile-tram-count').textContent = visible + ' trams';
}

function showInfo(vehicleId) {
  const m = markers[vehicleId];
  if (!m) return;
  const d = m.data;
  const def = ROUTE_DEFS[d.routeId] || { color: '#888', name: 'Unknown route' };

  selectedVehicle = vehicleId;
  document.querySelectorAll('.tram-icon-outer svg').forEach(el => el.classList.remove('selected'));
  document.getElementById('vm-' + vehicleId)?.classList.add('selected');

  document.getElementById('info-content').innerHTML = `
    <div style="display:flex;align-items:center;margin-bottom:12px;">
      <span class="info-route-badge" style="background:${def.color}">${d.routeId}</span>
      <span style="font-size:13px;font-weight:600;">${def.name}</span>
    </div>
    <div class="info-row"><span class="info-label">Vehicle</span><span class="info-value" style="font-family:var(--font-mono)">${d.vehicleId}</span></div>
    <div class="info-row"><span class="info-label">Speed</span><span class="info-value" style="font-family:var(--font-mono)">${d.speed} km/h</span></div>
    <div class="info-row"><span class="info-label">Bearing</span><span class="info-value" style="font-family:var(--font-mono)">${Math.round(d.bearing)}°</span></div>
    <div class="info-row"><span class="info-label">Position</span><span class="info-value" style="font-family:var(--font-mono);font-size:11px;">${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</span></div>
  `;

  document.getElementById('info-panel').classList.add('visible');
  if (Number.isFinite(d.lat) && Number.isFinite(d.lng)) map.panTo([d.lat, d.lng], { animate: true });
}

function closeInfo() {
  document.getElementById('info-panel').classList.remove('visible');
  document.querySelectorAll('.tram-icon-outer svg').forEach(el => el.classList.remove('selected'));
  selectedVehicle = null;
  selectedStop = null;
}

function setStatus(state, text) {
  const badge = document.getElementById('live-badge');
  const dot = badge.querySelector('.pulse');
  const span = document.getElementById('status-text');
  span.textContent = text;
  if (state === 'live') { dot.style.background = 'var(--green)'; }
  else if (state === 'error') { dot.style.background = 'var(--red)'; }
  else { dot.style.background = 'var(--amber)'; }
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

// ── Orient-north compass ─────────────────────────────────────
function orientNorth() {
  if (typeof map.setBearing === 'function') map.setBearing(0);
}
function updateCompass() {
  if (typeof map.getBearing !== 'function') return;
  mapBearing = map.getBearing() || 0;
  const rose = document.getElementById('compass-rose');
  // rotate the rose so the N/arrow keeps pointing at true north on the rotated map
  if (rose) rose.style.transform = 'rotate(' + (-mapBearing) + 'deg)';
  // One write, 1,638 tabs recomputed by the browser — no per-marker loop.
  map.getContainer().style.setProperty('--mb', mapBearing);
}

// ── Tap-a-stop: next tram in each direction ────────────────────────
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showStopInfo(sid) {
  if (!SCHEDULE || !TRAM_NETWORK) return;
  const stop = TRAM_NETWORK.stops[String(sid)];
  if (!stop) return;
  selectedStop = sid;
  // Deselect any tram
  document.querySelectorAll('.tram-icon-outer svg').forEach(el => el.classList.remove('selected'));
  selectedVehicle = null;

  const cs = nowSecs();
  const tapLat = stop.lat, tapLng = stop.lng;
  const baseRoutes = stop.r || [];

  // Melbourne stops are direction-specific (each platform is its own id, often on
  // opposite sides of the road and numbered separately). Rather than rely on
  // stop-id pairing, scan every trip of the routes serving this stop and find
  // where each trip passes CLOSEST to the tapped point. Both directions live in
  // SCHEDULE.trips[routeId], so this reliably surfaces both ways.
  const RADIUS_M = 150;
  const seen = new Set();
  const arrivals = []; // { routeId, dir, predArr, delay }

  baseRoutes.forEach(routeId => {
    if (!activeRoutes.has(routeId)) return;     // only routes the user has on
    const trips = SCHEDULE.trips[routeId] || [];
    trips.forEach(trip => {
      // Find the stop in this trip nearest the tapped location
      let best = null, bestIdx = -1, bestD = Infinity;
      for (let si = 0; si < trip.stops.length; si++) {
        const st = trip.stops[si];
        const sc = SCHEDULE.stops[String(st[0])];
        if (!sc) continue;
        const d = metresBetween(tapLat, tapLng, sc[0], sc[1]);
        if (d < bestD) { bestD = d; best = st; bestIdx = si; }
      }
      if (!best || bestD > RADIUS_M) return;
      const effT = effectiveStopTimes(trip);
      const predArr = effT[bestIdx];                       // per-stop prediction
      const delay = predArr - (trip.start + best[1]);      // delay at THIS stop
      if (predArr < cs - 90 || predArr > cs + 3600) return; // next ~hour only
      const key = routeId + '_' + trip.dir + '_' + trip.start;
      if (seen.has(key)) return;
      seen.add(key);
      // Destination = the trip's actual final stop (robust, unlike name-order guessing)
      const lastSt = TRAM_NETWORK.stops[String(trip.stops[trip.stops.length-1][0])];
      const dest = lastSt && lastSt.n ? lastSt.n.replace(/\s*#\S+$/, '') : null;
      arrivals.push({ routeId, dir: trip.dir, predArr, delay, dest });
    });
  });

  const byDir = {};
  arrivals.forEach(a => { (byDir[a.dir] = byDir[a.dir] || []).push(a); });
  Object.values(byDir).forEach(list => list.sort((x,y) => x.predArr - y.predArr));

  let html = '<div style="font-weight:600;font-size:14px;margin-bottom:2px;">' + escapeHtml(stop.n) + '</div>';
  // Walk time from the last geolocate fix: straight-line distance × 1.25 street
  // detour factor, at 80 m/min (~4.8 km/h), rounded up. Omitted with no fix.
  if (userLoc) {
    const walkM = metresBetween(userLoc.lat, userLoc.lng, stop.lat, stop.lng);
    const mins = Math.max(1, Math.ceil((walkM * 1.25) / 80));
    html += '<div style="font-size:13px;color:#fff;margin-bottom:2px;">Approx ' +
      mins + ' minute' + (mins === 1 ? '' : 's') + ' walk</div>';
  }
  html += '<div style="font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-bottom:10px;">NEXT TRAMS</div>';

  const dirKeys = Object.keys(byDir).filter(k => byDir[k].length);
  if (!dirKeys.length) {
    html += '<div style="font-size:12px;color:var(--muted);">No trams from switched-on routes scheduled here in the next hour.</div>';
  } else {
    dirKeys.forEach(dir => {
      const list = byDir[dir].slice(0, 3);
      const firstDef = ROUTE_DEFS[list[0].routeId] || { name: '' };
      const fparts = firstDef.name.split(' – ');
      const headDest = list[0].dest || ((String(dir) === '1' ? (fparts[1] || fparts[0]) : (fparts[0] || fparts[1])) || '');
      html += '<div style="font-size:10px;color:var(--muted);font-family:var(--font-mono);margin:8px 0 4px;">→ ' + escapeHtml(headDest) + '</div>';
      list.forEach(a => {
        const def = ROUTE_DEFS[a.routeId] || { color:'#888', name:'' };
        const parts = def.name.split(' – ');
        const dest = a.dest || ((String(a.dir) === '1' ? (parts[1] || parts[0]) : (parts[0] || parts[1])) || '');
        const mins = Math.round((a.predArr - cs) / 60);
        const minsLabel = mins <= 0 ? 'Due' : mins + ' min';
        const dmin = Math.round(a.delay / 60);
        const status = dmin > 2 ? dmin + ' late' : dmin < -1 ? Math.abs(dmin) + ' early' : 'on time';
        const scol = dmin > 2 ? '#f87171' : dmin < -1 ? '#34d399' : '#94a3b8';
        html += '<div class="info-row" style="align-items:center;margin-bottom:6px;">' +
          '<span class="info-route-badge" style="background:' + def.color + ';margin-right:8px;">' + a.routeId + '</span>' +
          '<span style="flex:1;font-size:12px;">' + escapeHtml(dest) + '</span>' +
          '<span style="font-family:var(--font-mono);font-size:13px;font-weight:600;margin-right:8px;">' + minsLabel + '</span>' +
          '<span style="font-family:var(--font-mono);font-size:10px;color:' + scol + ';">' + status + '</span>' +
          '</div>';
      });
    });
    html += '<div style="font-size:9px;color:var(--muted);font-family:var(--font-mono);margin-top:8px;">Estimated from timetable + live delays</div>';
  }

  document.getElementById('info-content').innerHTML = html;
  document.getElementById('info-panel').classList.add('visible');
  lastStopPanelRender = cs;
}

// ── Service alerts ────────────────────────────────────────────
function renderAlerts() {
  const affected = new Set();
  serviceAlerts.forEach(a => (a.routes || []).forEach(r => affected.add(String(r))));
  Object.keys(ROUTE_DEFS).forEach(id => {
    document.getElementById('route-item-' + id)?.classList.toggle('has-alert', affected.has(id));
  });
  const btn = document.getElementById('alerts-btn');
  const countEl = document.getElementById('alerts-count');
  if (!btn) return;
  if (serviceAlerts.length) { btn.style.display = ''; if (countEl) countEl.textContent = serviceAlerts.length; }
  else { btn.style.display = 'none'; document.getElementById('alerts-panel')?.classList.remove('visible'); }
}

function toggleAlertsPanel() {
  const p = document.getElementById('alerts-panel');
  if (!p) return;
  if (p.classList.contains('visible')) { p.classList.remove('visible'); return; }
  let html = '<button class="info-close-x" onclick="event.stopPropagation();toggleAlertsPanel()">×</button>' +
    '<div style="font-weight:600;font-size:14px;margin-bottom:10px;">Service Alerts</div>';
  if (!serviceAlerts.length) {
    html += '<div style="font-size:12px;color:var(--muted)">No current disruptions.</div>';
  } else {
    serviceAlerts.forEach(a => {
      const badges = (a.routes || []).map(r => {
        const def = ROUTE_DEFS[String(r)];
        return def ? '<span class="info-route-badge" style="background:' + def.color + ';margin-right:4px;">' + r + '</span>' : '';
      }).join('');
      html += '<div style="margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px;">' +
        (badges ? '<div style="margin-bottom:4px;">' + badges + '</div>' : '') +
        '<div style="font-size:12px;font-weight:600;margin-bottom:2px;">' + escapeHtml(a.header || '') + '</div>' +
        (a.description ? '<div style="font-size:11px;color:var(--muted);line-height:1.4;">' + escapeHtml(a.description) + '</div>' : '') +
        (a.url ? '<a href="' + encodeURI(a.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px;color:var(--accent);">More info →</a>' : '') +
        '</div>';
    });
  }
  p.innerHTML = html;
  p.classList.add('visible');
}

  fetchTrams();
  setInterval(updateClock, 1000);
  setInterval(fetchTrams, 10000);
  updateClock();
